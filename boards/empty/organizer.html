    /* Remove a saved answer from an earlier version of the sheet, after a confirm */
    const row = e.target.closest(".hq.earlier");
    if (row && e.target.closest(".eacts button")) {
      const acts = $q(".eacts", row);
      const b = e.target.closest(".eacts button");
      if (b.classList.contains("erm")) {
        acts.innerHTML =
          '<span>Remove this answer from My_answers.md?</span> <button type="button" class="btn small erm-yes">Remove</button> <button type="button" class="btn small erm-no">Keep</button>';
      } else if (b.classList.contains("erm-no")) {
        acts.innerHTML = '<button type="button" class="btn small erm">Remove</button>';
      } else if (b.classList.contains("erm-yes")) {
        mySet(row.dataset.ek, "");
        refreshEarlier();
      }
      return;
    }
    const hh = e.target.closest(".hq h4");
    if (hh && cuesOnly && !e.target.closest(".hcopy") && !e.target.closest("a"))
      hh.parentElement.classList.toggle("open");
  });
  leftWrap.addEventListener(
    "click",
    (e) => {
      if (e.target.closest(".hcopy")) setTimeout(() => pad.ta.focus({ preventScroll: true }), 0);
    },
    true,
  );
  $q(".padline", rh).onclick = () => pad.addLine();
  const pc = $q(".padcard", rh);
  if (pc) pc.onclick = () => pad.insert("── Notes from the card ──\n" + cardNotes + "\n\n");
  $q(".pnewcall", rh).onclick = () => {
    const cur = get(sec, id) || x;
    const when = cur.callAt
      ? fmtCall(cur.callAt)
      : new Date().toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
    pad.insert(
      `── ${when} · ${cur.callType || "Call"} · with: ${cur.callWith || ""}\nThey asked:\n- \nWhere I stumbled:\n- \nTeam, reporting line, pay range:\n- \nNext step and date:\n- \n\n`,
    );
  };
  leftWrap.addEventListener(
    "scroll",
    () => {
      scrollMem[id] = leftWrap.scrollTop;
    },
    { passive: true },
  );
  if (keep && scrollMem[id]) leftWrap.scrollTop = scrollMem[id];
  if (libOpenInSheet) showLib(libOpenInSheet);
  /* the cursor goes to the notes pad, so what you type first is never lost */
  if (focusWithNext) {
    focusWithNext = false;
    const w = $q(".callrow input[type=text]", d);
    if (w) w.focus({ preventScroll: true });
    else pad.ta.focus({ preventScroll: true });
  } else pad.ta.focus({ preventScroll: true });
  /* prep changed on disk? adopt it on the first read; after that offer a reload instead of swapping text under you */
  {
    let pendingText = null;
    const rebuild = () => {
      const keepY = leftWrap.scrollTop;
      /* an answer box you are typing in keeps the cursor (its text is already saved) */
      const a = document.activeElement;
      const box =
        a && a.matches("details.mine textarea") && left.contains(a) ? a.closest("details.mine").dataset.k : null;
      const caret = box ? a.selectionStart : 0;
      build();
      leftWrap.scrollTop = keepY;
      if (libOpenInSheet) showLib(libOpenInSheet);
      const again = box && $qa("details.mine", left).find((n) => n.dataset.k === box);
      if (again) {
        const ta = again.querySelector("textarea");
        again.open = true;
        ta.focus({ preventScroll: true });
        try {
          ta.setSelectionRange(caret, caret);
        } catch (e) {}
      }
    };
    refreshDocs().then((ch) => {
      if (ch && d.isConnected) rebuild();
    });
    /* answers read from My_answers.md after the sheet opened can belong in "Saved answers from earlier versions" */
    const onAnswers = () => {
      if (!d.isConnected) document.removeEventListener("jso-answers", onAnswers);
      else refreshEarlier();
    };
    document.addEventListener("jso-answers", onAnswers);
    if (isJob) {
      bar.querySelector("button").onclick = () => {
        PREPTXT[id] = pendingText;
        pendingText = null;
        bar.hidden = true;
        rebuild();
      };
      const check = async () => {
        if (!d.isConnected || !FS.ok()) return;
        let ch = false;
        const r = await FS.read(`Job notes/${id}/prep.md`);
        if (r && validPrep(r.text)) {
          if (r.text !== PREPTXT[id]) {
            if (!fileSeen[id]) {
              fileSeen[id] = true;
              PREPTXT[id] = r.text;
              ch = true;
            } else {
              pendingText = r.text;
              bar.hidden = false;
            }
          } else fileSeen[id] = true;
        }
        for (const nm of ["outreach", "posting"]) {
          const r2 = await FS.read(`Job notes/${id}/${nm}.md`);
          if (r2 && r2.text !== (JOBDOCS[id] || {})[nm]) {
            (JOBDOCS[id] = JOBDOCS[id] || {})[nm] = r2.text;
            ch = true;
          }
        }
        if (ch && d.isConnected) rebuild();
      };
      if (sheetTid) clearInterval(sheetTid);
      const tid = setInterval(() => {
        if (!d.isConnected) {
          clearInterval(tid);
          return;
        }
        check();
      }, 10000);
      sheetTid = tid;
      check();
    }
  }
}

/* keys inside a sheet: type freely in the notes pad; press Esc to leave it, then use the letter and number keys */
document.addEventListener(
  "keydown",
  (e) => {
    if (quickOpen) return;
    if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "k") {
      e.preventDefault();
      openQuick();
      return;
    }
    const d = $q("#drawerRoot .drawer.prep");
    const typing =
      document.activeElement &&
      document.activeElement.matches("textarea,select,input:not([type=checkbox]):not([type=radio]),[contenteditable]");
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if ((k === "h" || k === "H") && CONFIG.blurPay && (d || section === "library")) {
      e.preventDefault();
      showPay(!document.body.classList.contains("showpay"));
      return;
    }
    if (!d) {
      const drawerOpen = $q("#drawerRoot").childNodes.length > 0;
      if (drawerOpen) return;
      if (k === "g" || k === "G") {
        e.preventDefault();
        openQuick();
        return;
      }
      if (k === "/" && section === "next") {
        e.preventDefault();
        e.stopPropagation();
        openQuick();
        return;
      }
      if (k === "/" && section === "library") {
        const s = $q(".hlsearch");
        if (s) {
          e.preventDefault();
          e.stopPropagation();
          s.focus();
        }
      }
      return;
    }
    if (/^[1-9]$/.test(k)) {
      const a = $q(`.pills a[data-k="${k}"]`, d);
      if (a) {
        e.preventDefault();
        a.click();
      }
      return;
    }
    if (k === "n" || k === "N") {
      const ta = $q("#notes-pad", d);
      if (ta) {
        e.preventDefault();
        ta.focus();
      }
      return;
    }
    if (k === "/") {
      e.preventDefault();
      const f = $q(".pfilter", d);
      if (f) f.focus();
      return;
    }
    if (k === "g" || k === "G") {
      e.preventDefault();
      openQuick();
      return;
    }
    for (const b of CONFIG.library.sheetButtons)
      if (b.key && k.toLowerCase() === b.key.toLowerCase()) {
        const btn = $q(`.plib[data-doc="${cssId(b.doc)}"]`, d);
        if (btn) {
          e.preventDefault();
          btn.click();
        }
        return;
      }
  },
  true,
);

/* ---- 86-quick-open.js ---- */
/* ================= quick open (G or Ctrl/⌘ K): find any job, headhunter, person or guide question ================= */
const upFirst = (t) => String(t).charAt(0).toUpperCase() + String(t).slice(1);
let quickOpen = null;
function openLibDoc(id, anchor) {
  libDoc = id;
  libAnchor = anchor || null;
  section = "library";
  remember();
  render();
  window.scrollTo(0, 0);
}
function libIndex() {
  const out = [];
  for (const [id, D] of Object.entries(DOCS)) {
    if (!D.md) continue;
    const p = parse(D.md, { splitBold: D.splitBold });
    const used = {};
    const sid = (t) => {
      let k = "d-" + id + "-" + slug(t);
      while (used[k]) k += "x";
      used[k] = 1;
      return k;
    };
    const clean = (t) => String(t).replace(/[✎☐]/g, "").replace(/\s+/g, " ").trim();
    for (const s of p.secs) {
      const a = sid(s.title);
      out.push({
        lib: id,
        anchor: a,
        title: clean(s.title),
        sub: D.title,
        lane: "Prep library",
        hay: (clean(s.title) + " " + D.title).toLowerCase(),
      });
      for (const q of s.qs) {
        const b = sid(q.title);
        out.push({
          lib: id,
          anchor: b,
          title: clean(q.title),
          sub: D.title + " › " + clean(s.title),
          lane: "Prep library",
          hay: (clean(q.title) + " " + clean(s.title) + " " + D.title).toLowerCase(),
        });
      }
    }
  }
  return out;
}
function openQuick() {
  if (quickOpen) return;
  const prev = document.activeElement;
  const wrap = document.createElement("div");
  wrap.className = "hqo";
  wrap.innerHTML = `<div class="hqscrim"></div><div class="hqbox" role="dialog" aria-label="Quick open"><input type="search" placeholder="Jump to a job, ${esc(SECTIONS.hunters.noun)}, ${esc(SECTIONS.people.noun)} or question…" aria-label="Quick open"><div class="hqlist" role="listbox"></div><div class="hqhint"><kbd>↑</kbd><kbd>↓</kbd> choose · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close</div></div>`;
  document.body.append(wrap);
  quickOpen = wrap;
  const inp = $q("input", wrap),
    list = $q(".hqlist", wrap);
  let sel = 0,
    items = [];
  const all = [];
  for (const sec of BOARDS)
    for (const [id, x] of Object.entries(live(sec))) {
      const S = SECTIONS[sec];
      const laneId = laneKey(sec, x);
      const ln = laneOf(sec, laneId);
      all.push({
        sec,
        id,
        title: S.title(x),
        sub: S.sub(x) || "",
        lane: ln.name,
        laneId,
        done: !!ln.done,
        hay: [S.title(x), S.sub(x), x.company, x.firm, x.role, x.name].filter(Boolean).join(" ").toLowerCase(),
        /* a closed card's call is over as far as the board is concerned: no badge, no "booked call" ranking */
        call: callLive(x) && !ln.done ? shortCall(x.callAt) : "",
      });
    }
  let LIBX = null;
  /* booked calls first, then jobs in play, then headhunters, then everything else */
  const rank = (a) =>
    a.call
      ? 0
      : a.sec === "jobs"
        ? ["screen", "interview", "offer"].includes(a.laneId)
          ? 1
          : a.laneId === "applied"
            ? 2
            : a.done
              ? 6
              : 4
        : a.sec === "hunters"
          ? a.done
            ? 6
            : 3
          : 5;
  const firstSel = () => items.findIndex((a) => !a.note);
  const fallbacks = () =>
    CONFIG.library.sheetButtons
      .filter((b) => DOCS[b.doc])
      .map((b) => ({ lib: b.doc, title: DOCS[b.doc].title, sub: "From the Prep library", lane: "Prep library" }));
  function draw() {
    const words = inp.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const board = all
      .filter((a) => words.every((w) => a.hay.includes(w)))
      .sort((a, b) => rank(a) - rank(b) || a.title.localeCompare(b.title))
      .slice(0, 10);
    let lib = [];
    if (words.length) {
      if (!LIBX) LIBX = libIndex();
      lib = LIBX.filter((a) => words.every((w) => a.hay.includes(w))).slice(0, 4);
    }
    items = board.concat(lib);
    if (!items.length)
      items = [
        {
          note: words.length
            ? `No job, ${SECTIONS.hunters.noun}, ${SECTIONS.people.noun} or question matches “${inp.value.trim()}”. Open a guide:`
            : "Type a name or a question.",
        },
        ...fallbacks(),
      ];
    if (sel >= items.length || items[sel].note) sel = Math.max(0, firstSel());
    list.innerHTML = items
      .map((a, i) =>
        a.note
          ? `<div class="hqi note" data-i="${i}">${esc(a.note)}</div>`
          : `<div class="hqi${i === sel ? " on" : ""}" role="option" data-i="${i}"><b>${esc(a.title)}</b><span>${esc(a.sub)}</span><small>${a.lib ? "" : esc(a.sec === "jobs" ? "Job" : upFirst(SECTIONS[a.sec].noun)) + " · "}<b class="hql">${esc(a.lane)}</b>${a.call ? " · 📞 " + esc(a.call) : ""}</small></div>`,
      )
      .join("");
  }
  function close(refocus) {
    wrap.remove();
    quickOpen = null;
    if (refocus !== false)
      try {
        prev && prev.isConnected && prev.focus({ preventScroll: true });
      } catch (e) {}
  }
  function go(a) {
    if (!a || a.note) {
      return;
    }
    close(false);
    if (a.lib) {
      closeDrawer();
      openLibDoc(a.lib, a.anchor);
    } else openDrawer(a.sec, a.id);
  }
  inp.addEventListener("input", () => {
    sel = 0;
    draw();
  });
  inp.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      e.preventDefault();
      e.stopPropagation();
      close();
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      sel = Math.min(items.length - 1, sel + 1);
      draw();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      sel = Math.max(Math.max(0, firstSel()), sel - 1);
      draw();
    } else if (e.key === "Enter") {
      e.preventDefault();
      go(items[sel]);
    }
  });
  list.addEventListener("click", (e) => {
    const q = e.target.closest(".hqi[data-i]");
    if (q) go(items[+q.dataset.i]);
  });
  $q(".hqscrim", wrap).onclick = () => close();
  draw();
  inp.focus();
}

/* ---- 87-library-tab.js ---- */
/* ================= the Prep library tab: every guide, a search across all of them, a table of contents ================= */
let libDoc = CONFIG.library.defaultDoc,
  libAnchor = null;
function renderLibrary(v) {
  const groups = libGroups();
  if (!groups.length) {
    const m = document.createElement("p");
    m.className = "muted";
    m.style.padding = "16px";
    m.textContent =
      "No guides yet. Put Markdown files in the Library folder next to this page (the sample board has three to start from), then turn on saving.";
    v.append(m);
    return;
  }
  if (!DOCS[libDoc]) libDoc = DOCS[CONFIG.library.defaultDoc] ? CONFIG.library.defaultDoc : groups[0][1][0];
  const wrap = document.createElement("div");
  wrap.className = "hlib";
  const nav = document.createElement("nav");
  nav.className = "hlnav";
  nav.innerHTML =
    `<input type="search" class="hlsearch" placeholder="Search every guide  ( / )" aria-label="Search every guide">` +
    groups
      .map(
        ([g, ids]) =>
          `<div class="hlg">${esc(g)}</div>` +
          ids
            .map(
              (i) => `<a href="#" data-doc="${esc(i)}" class="${i === libDoc ? "on" : ""}">${esc(DOCS[i].title)}</a>`,
            )
            .join(""),
      )
      .join("") +
    `<div class="hlclear"><button type="button" class="linkbtn">Clear all my answers…</button></div>`;
  const read = document.createElement("article");
  read.className = "hlread";
  const toc = document.createElement("aside");
  toc.className = "hltoc";
  wrap.append(nav, read, toc);
  v.append(wrap);
  function show(docId, anchor) {
    libDoc = docId;
    $qa("a[data-doc]", nav).forEach((a) => a.classList.toggle("on", a.dataset.doc === docId));
    const D = DOCS[docId];
    if (!D) return;
    const r = renderDoc(D.md, "d-" + docId, { mineKey: docId, splitBold: D.splitBold });
    read.innerHTML = `<h1>${esc(r.title || D.title)}</h1>` + r.html;
    wireCopy(read);
    wireMine(read);
    toc.innerHTML = `<b>On this page</b>` + r.nav.map((n) => `<a href="#${n.id}">${esc(n.title)}</a>`).join("");
    if (anchor) {
      const t = read.querySelector("#" + cssId(anchor));
      if (t) setTimeout(() => t.scrollIntoView({ block: "start" }), 0);
    } else window.scrollTo(0, 0);
  }
  /* Clear all my answers: the one way to empty My_answers.md on purpose (a file that loses every answer at once is
     treated as a bad read and written again, see myOdd). Asks first; the toast can undo it. */
  const clearBox = $q(".hlclear", nav);
  const clearIdle = () => {
    clearBox.innerHTML = `<button type="button" class="linkbtn">Clear all my answers…</button>`;
  };
  clearBox.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const all = Object.entries(MY).filter(([, v]) => v && v.trim());
    if (b.classList.contains("hl-yes")) {
      for (const [k] of all) mySet(k, "");
      myFill();
      clearIdle();
      showToast(`Cleared ${all.length} answer${all.length === 1 ? "" : "s"} from My_answers.md.`, () => {
        for (const [k, v] of all) mySet(k, v);
        myFill();
      });
    } else if (b.classList.contains("hl-no")) clearIdle();
    else if (!all.length) showToast("You have no saved answers to clear.");
    else
      clearBox.innerHTML = `<span>Remove all ${all.length} of your answers (guides and prep sheets) from My_answers.md?</span> <button type="button" class="btn small hl-yes">Clear all</button> <button type="button" class="btn small hl-no">Cancel</button>`;
  });
  nav.addEventListener("click", (e) => {
    const a = e.target.closest("a[data-doc]");
    if (a) {
      e.preventDefault();
      $q(".hlsearch", nav).value = "";
      show(a.dataset.doc);
    }
  });
  toc.addEventListener("click", (e) => {
    const a = e.target.closest("a[href^='#']");
    if (a) {
      e.preventDefault();
      const t = read.querySelector("#" + cssId(a.getAttribute("href").slice(1)));
      if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });
  const srch = $q(".hlsearch", nav);
  srch.addEventListener("input", () => {
    const t = srch.value.trim().toLowerCase();
    if (!t) {
      show(libDoc);
      return;
    }
    const hits = [];
    for (const [id, D] of Object.entries(DOCS)) {
      if (!D.md) continue;
      const p = parse(D.md, { splitBold: D.splitBold });
      for (const s of p.secs) {
        const units = s.qs.length
          ? s.qs.map((q) => ({ t: q.title, body: q.lines.join(" "), pay: s.pay || q.pay }))
          : [{ t: s.title, body: s.pre.join(" "), pay: s.pay }];
        for (const u of units) {
          const plainT = (u.t + " " + u.body)
            .replace(/\*\*|\*|(^|\s)>\s?|:::\s*fold|\{\.pay\}|\|/g, " ")
            .replace(/\s+/g, " ");
          const k = plainT.toLowerCase().indexOf(t);
          if (k >= 0)
            hits.push({
              id,
              sec: s.title,
              t: u.t,
              len: u.body.length,
              real: u.body.length > 60,
              inTitle: String(u.t).toLowerCase().includes(t),
              pay: !!u.pay,
              snip: plainT.slice(Math.max(0, k - 40), k + 100),
            });
        }
      }
    }
    /* real answers first (a one-line mention or a short answer comes after), then a hit in the question itself,
       then the longer answer */
    hits.sort((a, b) => b.real - a.real || b.inTitle - a.inTitle || b.len - a.len);
    $qa("a[data-doc]", nav).forEach((a) => a.classList.remove("on"));
    const snip = (h) =>
      h.pay && CONFIG.blurPay ? `<span class="paynote-s">Pay: open it to see</span>` : `<span>…${esc(h.snip)}…</span>`;
    read.innerHTML =
      `<h1>Search: “${esc(srch.value)}”</h1>` +
      (hits.length
        ? hits
            .slice(0, 80)
            .map(
              (h) =>
                `<a class="hit" href="#" data-doc="${esc(h.id)}" data-sec="${esc(h.t)}"><b>${inline(h.t)}</b><small>${esc(DOCS[h.id].title)}${h.t !== h.sec ? " › " + esc(h.sec) : ""}</small>${snip(h)}</a>`,
            )
            .join("")
        : `<p class="muted">Nothing found.</p>`);
    toc.innerHTML = "";
  });
  srch.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const a = $q("a.hit", read);
      if (a) {
        e.preventDefault();
        a.click();
      }
    }
  });
  read.addEventListener("click", (e) => {
    const a = e.target.closest("a.hit");
    if (!a) return;
    e.preventDefault();
    const id = a.dataset.doc;
    srch.value = "";
    show(id, "d-" + id + "-" + slug(a.dataset.sec));
  });
  show(libDoc, libAnchor);
  libAnchor = null;
  refreshDocs(true).then((ch) => {
    if (ch && v.isConnected && section === "library" && !srch.value) {
      v.textContent = "";
      renderLibrary(v);
    }
  });
}
/* Coming back to the window re-reads the guides, so a file you just edited or added shows up. */
window.addEventListener("focus", async () => {
  if (
    section === "library" &&
    !$("#drawerRoot").childNodes.length &&
    !($q(".hlsearch") || {}).value &&
    (await refreshDocs(true))
  )
    render();
});

/* ---- 88-backups.js ---- */
/* ================= backups =================
   1. Every day, the first save (or start-up, on a day without edits) copies the data file into backups/ (see storage.js).
   2. Every day, your notes (every my_notes.md under Job notes, and Library/My_answers.md) are copied into backups/notes_<date>/.
   3. Optional: a second folder somewhere else (an external drive, a synced folder) gets a full copy of the board folder
      once a day. It can't be inside the board folder itself. */
const BK_DAY = "bkDay",
  BK2_DAY = "bk2Day";
async function writeTo(dst, name, text) {
  const fh = await dst.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(text);
  await w.close();
}
/* one snapshot per day; a manual "Back up now" adds another. A folder only counts as done once its _complete.txt exists. */
async function snapshotNotes(manual) {
  if (!FS.ok()) return { ok: false, n: 0 };
  let n = 0;
  const day = TODAY();
  try {
    const src = [];
    let jn = null;
    try {
      jn = await FS.dir("Job notes");
    } catch (e) {}
    if (jn)
      for await (const [nm, h] of jn.entries()) {
        if (h.kind !== "directory") continue;
        if (nm === "hunters") {
          for await (const [n2, h2] of h.entries()) if (h2.kind === "directory") src.push([h2, "hunters__" + n2]);
        } else src.push([h, nm]);
      }
    const files = [];
    for (const [dh, prefix] of src)
      for await (const [nm, h] of dh.entries())
        if (h.kind === "file" && /^my_notes.*\.md$/.test(nm)) files.push([h, prefix + "__" + nm]);
    const my = await FS.read(MYPATH);
    if (!files.length && !my) return { ok: true, n: 0, empty: true };
    const bk = await FS.dir("backups", true);
    let name = "notes_" + day,
      done = false;
    try {
      const d0 = await bk.getDirectoryHandle(name);
      try {
        await d0.getFileHandle("_complete.txt");
        done = true;
      } catch (e) {}
    } catch (e) {}
    if (done && !manual) return { ok: true, n: 0, kept: true };
    if (done && manual) name = name + "_" + new Date().toTimeString().slice(0, 5).replace(":", "");
    const dst = await bk.getDirectoryHandle(name, { create: true });
    for (const [h, fname] of files) {
      await writeTo(dst, fname, await (await h.getFile()).text());
      n++;
    }
    if (my) {
      await writeTo(dst, "My_answers.md", my.text);
      n++;
    }
    await writeTo(dst, "_complete.txt", new Date().toISOString());
    const dirs = [];
    for await (const [nm, h] of bk.entries())
      if (h.kind === "directory" && /^notes_\d{4}-\d{2}-\d{2}(_\d{4})?$/.test(nm)) dirs.push(nm);
    dirs.sort();
    for (const nm of dirs.slice(0, Math.max(0, dirs.length - CONFIG.backups.notesDays)))
      try {
        await bk.removeEntry(nm, { recursive: true });
      } catch (e) {}
    lsSet(BK_DAY, day);
    return { ok: true, n };
  } catch (e) {
    return { ok: false, n, err: e };
  }
}
async function copyTreeForBackup(src, dst, skip, depth) {
  let c = 0;
  depth = depth || 0;
  if (depth > 8) return c;
  for await (const [nm, h] of src.entries()) {
    if (h.kind === "directory") {
      if (depth === 0 && (skip.includes(nm) || nm.startsWith(CONFIG.backups.secondFolderPrefix))) continue;
      c += await copyTreeForBackup(h, await dst.getDirectoryHandle(nm, { create: true }), skip, depth + 1);
    } else {
      const f = await h.getFile();
      const fh = await dst.getFileHandle(nm, { create: true });
      const w = await fh.createWritable();
      await w.write(await f.arrayBuffer());
      await w.close();
      c++;
    }
  }
  return c;
}
const secondFolder = async () => {
  try {
    return await idbGet("second");
  } catch (e) {
    return null;
  }
};
/* the second folder must be somewhere else: never the board folder itself or anything inside it */
async function unsafeTarget(h) {
  try {
    if (await h.isSameEntry(dirHandle)) return true;
  } catch (e) {}
  try {
    if (typeof dirHandle.resolve === "function" && (await dirHandle.resolve(h))) return true;
  } catch (e) {}
  return false;
}
async function secondBackup(h, manual) {
  if (!h || !FS.ok()) return { ok: false };
  try {
    if (await unsafeTarget(h)) return { ok: false, unsafe: true };
    let p = "granted";
    try {
      p = await h.queryPermission({ mode: "readwrite" });
      if (p !== "granted" && manual) p = await h.requestPermission({ mode: "readwrite" });
    } catch (e) {}
    if (p !== "granted") return { ok: false, perm: true };
    const day = TODAY();
    const dst = await h.getDirectoryHandle(CONFIG.backups.secondFolderPrefix + day, { create: true });
    const n = await copyTreeForBackup(dirHandle, dst, ["backups"], 0);
    const re = new RegExp(
      "^" + CONFIG.backups.secondFolderPrefix.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\d{4}-\\d{2}-\\d{2}$",
    );
    const names = [];
    for await (const [nm, k] of h.entries()) if (k.kind === "directory" && re.test(nm)) names.push(nm);
    names.sort();
    for (const nm of names.slice(0, Math.max(0, names.length - CONFIG.backups.secondCopies)))
      try {
        await h.removeEntry(nm, { recursive: true });
      } catch (e) {}
    lsSet(BK2_DAY, day);
    return { ok: true, n, name: h.name };
  } catch (e) {
    return { ok: false, err: e };
  }
}
const bkStatus = (msg) => {
  const s = $q("#backupStatus");
  if (s) s.textContent = msg;
};
const second2msg = (r) =>
  r.ok
    ? ` Second copy in “${r.name}” at ${hhmm(new Date())} (${r.n} files). It holds all your notes, so keep that folder private.`
    : r.unsafe
      ? " That second folder is inside your board folder, so it was not used. Choose a different folder."
      : r.perm
        ? " The second copy needs a click: press Back up notes now."
        : " The second copy failed.";
async function backupNow(manual) {
  const r = await snapshotNotes(true);
  let msg = r.ok
    ? r.empty
      ? "No notes to back up yet. They appear as soon as you type in a notes pad."
      : `Backed up ${r.n} note file${r.n === 1 ? "" : "s"} at ${hhmm(new Date())}.`
    : FS.ok()
      ? "Backup failed. Nothing was lost."
      : "Turn on saving to back up.";
  const h = await secondFolder();
  if (h) msg += second2msg(await secondBackup(h, manual));
  else msg += " No second folder chosen yet.";
  bkStatus(msg);
  return r.ok;
}
async function pickSecond() {
  try {
    const h = await window.showDirectoryPicker({ id: CONFIG.pickerIds.secondBackup, mode: "readwrite" });
    if (await unsafeTarget(h)) {

      );

    }
    await idbSet("second", h);

    );

  } catch (e) {
    if (!e || e.name !== "AbortError") bkStatus("Couldn't open that folder.");
  }
}
/* Once saving is on: pick up new prep sheets, take today's backups, and repeat every 20 minutes. */
let startedUp = false;
async function startup() {
  if (!FS.ok()) return;
  await scanPrep();
  await backupToday();
  const day = TODAY();
  const last = lsGet(BK_DAY, "");
  let msg = "";
  if (last !== day) {
    const r = await snapshotNotes(false);
    if (r.ok && r.empty) msg = "No notes to back up yet.";
    else if (r.ok && !r.kept) msg = `Notes backed up today (${r.n} file${r.n === 1 ? "" : "s"}).`;
    else if (r.ok) msg = "Notes backed up today.";
  } else msg = "Notes backed up today.";
  const h = await secondFolder();
  const l2 = lsGet(BK2_DAY, "");
  if (h && l2 !== day) {
    const r2 = await secondBackup(h, false);
    msg += second2msg(r2);
  } else if (!h) msg += " No second folder chosen yet.";
  if (msg) bkStatus(msg);
}

/* ================= Restore a backup… =================
   Lists backups/board_data_*.js (the daily copies, the older copies a merge kept and the copies saved before a restore),
   or takes any .js file you pick. After a confirm, the data file as it is now goes to
   backups/board_data_before_restore_<time>.js, then the backup's records replace this board's: each one is stamped as a
   change you just made, so it wins everywhere (the file, other tabs, the next merge). Cards added since the backup are
   removed (Restore brings one back). The toast can undo it. Copying an old file over board_data.js does not restore
   anything: the page reads that as an older copy and keeps the newer values. */
const plural = (n, noun) => `${n} ${n === 1 ? noun : noun === "person" ? "people" : noun + "s"}`;
function backupInfo(text) {
  try {
    const data = normalize(parseDataText(text));
    const n = (c) => Object.values(data[c]).filter((r) => !r.deleted).length;
    const counts = [...BOARDS.map((c) => plural(n(c), SECTIONS[c].noun)), plural(n("todos"), "to-do")].join(", ");
    return { data, counts };
  } catch (e) {
    return null;
  }
}
async function backupList() {
  const out = [];
  try {
    const bdir = await dirHandle.getDirectoryHandle("backups");
    const base = DATA_FILE.replace(/\.js$/, "") + "_";
    for await (const [name, h] of bdir.entries())
      if (h.kind === "file" && name.startsWith(base) && name.endsWith(".js")) {
        const f = await h.getFile();
        out.push({ name, time: f.lastModified, text: await f.text() });
      }
  } catch (e) {}
  return out.sort((a, b) => b.time - a.time);
}
const whenLabel = (t) =>
  new Date(t).toLocaleString([], {
    month: "short",
    day: "numeric",
    year: "numeric",
    hour: "numeric",
    minute: "2-digit",
  });
/* the board's records replaced by `src` (see the top); returns the number of cards restored */
function replaceStore(src) {
  const next = emptyStore();
  for (const c of COLLS)
    for (const id of new Set([...Object.keys(store[c]), ...Object.keys(src[c])])) {
      const old = Object.hasOwn(store[c], id) ? store[c][id] : null;
      const r = Object.hasOwn(src[c], id) ? src[c][id] : null;
      if (!r && old.deleted) {
        next[c][id] = old;
        continue;
      }
      const rec = clean({
        ...(r || { ...old, deleted: true, removedAt: nowIso() }),
        updatedAt: stamp(old),
        changedBy: "you",
      });
      touch(c + ":" + id, old, rec);
      next[c][id] = rec;
    }
  store = next;
  persist();
  render();
  if (openRef) refreshDrawer();
}
async function restoreBackup(text, label) {
  if (!dirHandle || !canWrite) {
    showToast("Turn on saving to your folder first, so the restored board can be saved.");
    return false;
  }
  const info = backupInfo(text);
  if (!info) {
    showToast("That file isn't a board backup (it has no window.BOARD_DATA = {…}). Nothing was changed.");
    return false;
  }
  /* take in what the file holds now, and keep a copy of it */
  if ((await readFileInto()) === "bad") {
    showToast(`${DATA_FILE} has an error right now. Nothing was changed.`);
    return false;
  }
  try {
    if (lastRaw.trim()) {
      const stamp2 = TODAY() + "_" + new Date().toTimeString().slice(0, 8).replace(/:/g, "");
      await writeTo(
        await dirHandle.getDirectoryHandle("backups", { create: true }),
        `${DATA_FILE.replace(/\.js$/, "")}_before_restore_${stamp2}.js`,
        lastRaw,
      );
    }
  } catch (e) {
    showToast("Couldn't save a copy of the current board first, so nothing was restored.");
    return false;
  }
  const before = copyStore(store);
  replaceStore(info.data);
  await writeFile();
  showToast(`Restored the copy from ${label} (${info.counts}). Your board as it was is in backups/.`, async () => {
    replaceStore(before);
    await writeFile();
    showToast("Restore undone.");
  });
  return true;
}
async function openRestore() {
  if (VIEW_ONLY) return blockedEdit();
  if (!dirHandle || !canWrite) {
    showToast("Turn on saving to your folder first: backups are kept in its backups/ folder.");
    return;
  }
  lastFocusKey = focusKey();
  const root = $("#drawerRoot");
  root.textContent = "";
  openRef = null;
  const list = el("div", { class: "rlist" }, el("p", { class: "muted", text: "Looking in backups/…" }));
  const pick = el("input", { type: "file", accept: ".js,text/javascript", class: "rpick", hidden: true });
  const d = el(
    "aside",
    { class: "drawer restore", role: "dialog", "aria-modal": "true", "aria-labelledby": "rTitle", tabindex: "-1" },
    el("button", { class: "close", type: "button", "aria-label": "Close", text: "×", onclick: closeDrawer }),
    el("h2", { id: "rTitle", text: "Restore a backup" }),
    el("p", {
      class: "muted",
      text: "Pick the copy to go back to. Your board as it is now is saved to backups/ first, and you can undo right after.",
    }),
    list,
    el(
      "p",
      {},
      el("button", { class: "btn small", type: "button", text: "Choose a file…", onclick: () => pick.click() }),
      pick,
    ),
  );
  root.append(el("div", { class: "scrim", onclick: closeDrawer }), d);
  setTimeout(() => d.focus(), 0);
  /* one row per copy; Restore… asks first */
  const row = (title, sub, text) => {
    const info = backupInfo(text);
    const acts = el("div", { class: "racts" });
    const idle = () => {
      acts.textContent = "";
      acts.append(
        info
          ? el("button", { class: "btn small", type: "button", text: "Restore…", onclick: ask })
          : el("span", { class: "muted", text: "can't be read" }),
      );
    };
    const ask = () => {
      acts.textContent = "";
      acts.append(
        el("span", { text: "Replace your board with this copy?" }),
        el("button", {
          class: "btn small primary",
          type: "button",
          text: "Restore",
          onclick: async () => {
            if (await restoreBackup(text, title)) closeDrawer();
          },
        }),
        el("button", { class: "btn small", type: "button", text: "Cancel", onclick: idle }),
      );
    };
    idle();
    return el(
      "div",
      { class: "rrow" },
      el("div", {}, el("b", { text: title }), el("small", { text: sub + (info ? " · " + info.counts : "") })),
      acts,
    );
  };
  pick.addEventListener("change", async () => {
    const f = pick.files && pick.files[0];
    if (!f) return;
    const text = await f.text();
    list.prepend(row(f.name, "chosen file", text));
    pick.value = "";
  });
  const items = await backupList();
  list.textContent = "";
  if (!items.length) list.append(el("p", { class: "muted", text: "No backups in backups/ yet." }));
  for (const b of items) list.append(row(whenLabel(b.time), b.name, b.text));
}

/* ================= public hooks and start-up ================= */

if (CONFIG.blurPay) document.body.classList.add("blurpay");

/* this browser's copy, merged with the file, is kept at once (another open tab takes it from there) */
persistLocal();
if (!fileCopy && !localCopy && !FS_OK)
  showToast(`Couldn't find ${DATA_FILE} next to this page. Keep both files in the same folder.`);
(async () => {
  if (!FS_OK) return;
  /* A page that embeds the app can hand it a folder (the live demo uses one in memory); otherwise use the remembered one. */
  const h = window.ORGANIZER_FOLDER || (await idbGet("dir"));
  if (h) {

      canWrite = (await h.queryPermission({ mode: "readwrite" })) === "granted";
    } catch (e) {
      canWrite = false;
    }
    if (canWrite) {
      const before = collectionsOnly(store);
      const r = await readFileInto();
      if (r === "bad") {
        saveErr = "bad";
      }
      /* today's copy of the data file, even if nothing gets saved today */
      if (r === "ok") await dailyBackup(lastRaw);
      if (
        r !== "bad" &&
        (!fileCopy || collectionsOnly(store) !== collectionsOnly(fileCopy) || before !== collectionsOnly(store))
      )

})();
/* Once saving is on, the prep features start (new prep sheets, daily note backups), then every 20 minutes. */
const startTimer = setInterval(() => {
  if (FS.ok() && !startedUp) {
    startedUp = true;
    clearInterval(startTimer);
    startup();
    setInterval(startup, 20 * 60 * 1000);
  }
}, 2500);
/* Pick up changes another tool (a script, an AI assistant) made while this page was open: the data file first, then new
   prep sheets (reading the data file first keeps the time in which an edit typed in the panel could race it short).
   With a panel or prep sheet open, the changes are merged in the background: the notes pad stays as it is, the panel's
   fields show the merged values (except one you are typing in, see refreshDrawer), and the board is redrawn and job
   folders are filed when the panel closes. `focusRun` is the running pass (tests wait for it). */
const panelOpen = () => $("#drawerRoot").childNodes.length > 0;
let focusRun = null;
async function onFocus() {
  const ref = panelOpen() && openRef ? { ...openRef } : null;
  let recBefore = ref ? JSON.stringify(get(ref.sec, ref.id) || null) : "";
  let prepBefore = ref ? PREPTXT[ref.id] : undefined;
  const syncPanel = () => {
    if (!ref || !openRef || openRef.sec !== ref.sec || openRef.id !== ref.id) return;
    const rec = JSON.stringify(get(ref.sec, ref.id) || null);
    if (rec !== recBefore || PREPTXT[ref.id] !== prepBefore) {
      recBefore = rec;
      prepBefore = PREPTXT[ref.id];
      refreshDrawer();
    }
  };
  if (dirHandle && canWrite && !writing) {
    const before = collectionsOnly(store);
    const r = await readFileInto();
    if (r === "bad") {
      saveErr = "bad";
      renderStatus();
      syncPanel();
      return;
    }
    if (r === "ok" && saveErr === "bad") {
      saveErr = "";
      if (dirty) writeFile();
    }
    if (collectionsOnly(store) !== before) {
      persistLocal();
      if (panelOpen()) {
        fileOnClose = true;
        renderStatus();
      } else {
        render();
        /* a card moved by another tool gets its job folder filed by stage right away (every job is checked) */
        setTimeout(() => fileJobs(true), 50);
      }
    } else renderStatus();
    /* The file is missing something this browser has (a tool wrote back an older or partial copy, or a record was merged
       field by field): write it back. */
    if (r === "ok" && lastRaw && collectionsOnly(normalize(parseDataText(lastRaw))) !== collectionsOnly(store)) {
      gen++;
      dirty = true;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(writeFile, 400);
    }
    syncPanel();
  }
  /* an open prep sheet checks its own prep.md; a plain panel does not, so its job is scanned like the rest */
  if (FS.ok()) {
    await scanPrep(
      panelOpen()
        ? {
            quiet: true,
            skip: openRef && openRef.sec === "jobs" && $("#drawerRoot .drawer.prep") ? openRef.id : null,
          }
        : undefined,
    );
    scanFolders(true);
  }
  syncPanel();
}
window.addEventListener("focus", () => {
  focusRun = onFocus();
});
/* Keep two open copies of the page in step. An open panel shows the other tab's change like a change from the folder.
   The other tab's records merge field by field: the field this browser changed last wins (see mergeTab), so every tab
   settles on the latest change. The values the other tab saw in the file are added to this tab's history. */
function mergeOtherTab(raw) {
  const theirs = normalize(raw);
  const tf = raw && raw._ft && typeof raw._ft === "object" ? raw._ft : {};
  const next = copyStore(store);
  for (const c of COLLS)
    for (const id of Object.keys(theirs[c])) {
      const k = c + ":" + id;
      next[c][id] = mergeTab(k, next[c][id], theirs[c][id], timesIn(tf[k]));
    }
  store = next;
  const at = new Map();
  for (const [k, H] of histIn(raw && raw._hist, theirs, at)) {
    seenAt.set(k, Math.max(seenAt.get(k) || 0, at.get(k)));
    const had = hist.get(k);
    if (!had) hist.set(k, H);
    else {
      const mine = { ...had };
      for (const [u, l] of Object.entries(H))
        mine[u] = [...seenOf(had, u), ...l.filter((x) => !seenOf(had, u).includes(x))].slice(0, HMAX);
      hist.set(k, mine);
    }
  }
}
window.addEventListener("storage", (e) => {
  if (e.key !== lsKey("board") || !e.newValue) return;
  try {
    const before = collectionsOnly(store);
    const recBefore = openRef ? JSON.stringify(get(openRef.sec, openRef.id) || null) : "";
    mergeOtherTab(JSON.parse(e.newValue));
    if (collectionsOnly(store) !== before) {
      persistLocal();
      if (canWrite) {
        gen++;
        dirty = true;
        clearTimeout(saveTimer);
        saveTimer = setTimeout(writeFile, 400);
      }
      if (!panelOpen()) render();
      else if (openRef && JSON.stringify(get(openRef.sec, openRef.id) || null) !== recBefore) refreshDrawer();
    }
  } catch (x) {}
});
/* Refresh "due today" when the date changes while the page is open, and take the new day's data backup. */

    if (TODAY() !== shownDay) {
      shownDay = TODAY();

);

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    flushPending();
    if (dirty) {
      clearTimeout(saveTimer);
      writeFile();
    }

});

});
window.addEventListener("beforeunload", (e) => {
  flushPending();
  if (!VIEW_ONLY && canWrite && dirty) {
    clearTimeout(saveTimer);
    writeFile();
    e.preventDefault();
    e.returnValue = "";
  }
});
