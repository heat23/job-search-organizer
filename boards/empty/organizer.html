<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Job Search Organizer</title>
    <style>
/* Board: layout, lanes, cards, drawer, to-dos. Colors are tokens with light and dark values. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f7f9fb;
  --ink: #18202d;
  --muted: #5b6678;
  --faint: #5b6678;
  --line: #d9dee6;
  --accent: #2b55c9;
  --accent-soft: #e4ebfb;
  --focus: #2b55c9;
  --on-accent: #ffffff;
  --l-gray: #8a94a5;
  --l-blue: #2b55c9;
  --l-amber: #b7791f;
  --l-violet: #7a4fc4;
  --l-green: #1e8a5a;
  --l-slate: #6b7280;
  --warn-bg: #fff4dc;
  --warn-ink: #8a5a00;
  --danger: #b42318;
  --shadow: 0 1px 2px rgba(24, 32, 45, 0.08), 0 1px 1px rgba(24, 32, 45, 0.04);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #12161d;
    --surface: #1b212b;
    --surface-2: #171c25;
    --ink: #e6eaf1;
    --muted: #a3adbd;
    --faint: #909aab;
    --line: #2c3441;
    --accent: #7f9df0;
    --accent-soft: #233052;
    --focus: #9db4f5;
    --on-accent: #0f1420;
    --l-gray: #7c8697;
    --l-blue: #7f9df0;
    --l-amber: #e0a640;
    --l-violet: #a98be6;
    --l-green: #4cc38a;
    --l-slate: #8b93a1;
    --warn-bg: #3a2e12;
    --warn-ink: #f2c66d;
    --danger: #f97066;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12161d;
  --surface: #1b212b;
  --surface-2: #171c25;
  --ink: #e6eaf1;
  --muted: #a3adbd;
  --faint: #909aab;
  --line: #2c3441;
  --accent: #7f9df0;
  --accent-soft: #233052;
  --focus: #9db4f5;
  --on-accent: #0f1420;
  --l-gray: #7c8697;
  --l-blue: #7f9df0;
  --l-amber: #e0a640;
  --l-violet: #a98be6;
  --l-green: #4cc38a;
  --l-slate: #8b93a1;
  --warn-bg: #3a2e12;
  --warn-ink: #f2c66d;
  --danger: #f97066;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
}
* {
  box-sizing: border-box;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 16px 48px;
}
button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
a {
  color: var(--accent);
}

.top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
  margin-bottom: 12px;
}
h1 {
  font-size: 20px;
  font-weight: 600;
  margin: 0;
  letter-spacing: -0.01em;
}
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 7px 12px;
  cursor: pointer;
  font-weight: 500;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover {
  border-color: var(--faint);
}
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}
.btn.small {
  padding: 4px 9px;
  font-size: 12.5px;
}

.nav {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 14px;
  overflow-x: auto;
}
.nav button {
  flex: none;
  border: 0;
  background: none;
  padding: 9px 12px 10px;
  cursor: pointer;
  font-weight: 500;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.nav button[aria-current="page"] {
  color: var(--ink);
  border-bottom-color: var(--ink);
}
.badge {
  font-family: var(--mono);
  font-size: 11px;
  background: var(--warn-bg);
  color: var(--warn-ink);
  border-radius: 999px;
  padding: 0 6px;
  font-weight: 500;
}
.badge.plain {
  background: var(--surface-2);
  color: var(--muted);
  border: 1px solid var(--line);
}
.summary {
  color: var(--muted);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  margin-bottom: 12px;
}
.summary b {
  color: var(--ink);
  font-weight: 600;
}

.tabs {
  display: none;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 10px;
  margin-bottom: 4px;
}
.tab {
  flex: none;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
}
.tab[aria-pressed="true"] {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--bg);
}
.tab .n {
  font-family: var(--mono);
  font-size: 12px;
  opacity: 0.75;
}

.board {
  display: grid;
  gap: 12px;
  overflow-x: auto;
  align-items: stretch;
  padding-bottom: 8px;
}
.lane {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  min-height: 160px;
}
.lane.drop {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.lane-h {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
}
.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex: none;
}
.lane-h .name {
  font-weight: 600;
  font-size: 13px;
}
.lane-h .n {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
}
.cards {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
}
.empty {
  color: var(--faint);
  font-size: 12.5px;
  padding: 6px 4px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 11px;
  box-shadow: var(--shadow);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.card:hover {
  border-color: var(--faint);
}
.card.dragging {
  opacity: 0.45;
}
.card .co {
  font-weight: 600;
  font-size: 14px;
}
.card .role {
  font-size: 13px;
}
.card .meta {
  color: var(--muted);
  font-size: 12px;
}
.card .row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 2px;
}
.card .post {
  font-size: 12.5px;
  font-weight: 500;
  text-decoration: none;
}
.card .post:hover {
  text-decoration: underline;
}
.tag {
  font-family: var(--sans);
  font-size: 11.5px;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 0 5px;
  color: var(--muted);
}
.tag.word {
  font-family: var(--sans);
}
.tag.fu {
  background: var(--warn-bg);
  color: var(--warn-ink);
  border-color: transparent;
  font-family: var(--sans);
}
.card .note {
  color: var(--muted);
  font-size: 12px;
  border-top: 1px dashed var(--line);
  padding-top: 5px;
  margin-top: 3px;
  white-space: pre-wrap;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Next up */
.next {
  max-width: 760px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.group h3 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--faint);
  margin: 0 0 8px;
  font-weight: 600;
}
.item {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 12px;
  align-items: center;
  box-shadow: var(--shadow);
}
.item + .item {
  margin-top: 8px;
}
.item .what {
  font-weight: 600;
  cursor: pointer;
}
.item .what:hover {
  text-decoration: underline;
}
.item .why {
  color: var(--muted);
  font-size: 12.5px;
  grid-column: 1;
}
.item .acts {
  grid-row: 1 / span 2;
  grid-column: 2;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.kind {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--faint);
  margin-right: 6px;
}
.calm {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 16px;
  color: var(--muted);
}

/* Plan */
.plan {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 14px;
}
.plan summary {
  cursor: pointer;
  padding: 11px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  list-style: none;
  font-weight: 600;
}
.plan summary::-webkit-details-marker {
  display: none;
}
.plan summary .chev {
  margin-left: auto;
  color: var(--faint);
  font-weight: 400;
  font-size: 12.5px;
}
.meter {
  flex: 1;
  max-width: 220px;
  height: 6px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
}
.meter i {
  display: block;
  height: 100%;
  background: var(--l-green);
}
.plan .weeks {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  padding: 4px 14px 14px;
}
.plan .wk h4 {
  margin: 0 0 6px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--faint);
}
.plan label {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 4px 0;
  font-size: 13px;
  cursor: pointer;
}
.plan input {
  margin-top: 3px;
  accent-color: var(--l-green);
}
.plan label.done span {
  color: var(--faint);
  text-decoration: line-through;
}

.todos {
  max-width: 760px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.addrow {
  display: flex;
  gap: 8px;
}
.addrow input {
  flex: 1;
}
.todo {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 10px;
  align-items: start;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 12px;
}
.todo + .todo {
  margin-top: 6px;
}
.todo input[type="checkbox"] {
  margin-top: 4px;
  width: 16px;
  height: 16px;
  accent-color: var(--l-green);
  cursor: pointer;
}
.todo .t {
  cursor: pointer;
}
.todo .src {
  grid-column: 2;
  font-size: 11.5px;
  color: var(--faint);
}
.todo .src .who {
  font-weight: 600;
  letter-spacing: 0.02em;
}
.todo .det {
  grid-column: 2;
  color: var(--muted);
  font-size: 12.5px;
  white-space: pre-wrap;
  margin-top: 4px;
}
.todo .det a {
  overflow-wrap: anywhere;
}
.todo.done .t {
  color: var(--faint);
  text-decoration: line-through;
}
.linkbtn {
  background: none;
  border: 0;
  padding: 0;
  color: var(--accent);
  cursor: pointer;
  font-size: 12.5px;
}
details.donebox summary {
  cursor: pointer;
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 8px;
}

/* Drawer */
.scrim {
  position: fixed;
  inset: 0;
  background: rgba(10, 14, 22, 0.35);
  z-index: 10;
}
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(440px, 100%);
  background: var(--surface);
  border-left: 1px solid var(--line);
  z-index: 11;
  display: flex;
  flex-direction: column;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 18px calc(16px + env(safe-area-inset-bottom, 0px));
  gap: 14px;
  overflow-y: auto;
}
.drawer h2 {
  margin: 0;
  font-size: 18px;
  padding-right: 32px;
}
.drawer .sub {
  color: var(--muted);
  margin-top: 2px;
}
.close {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: 12px;
  border: 0;
  background: none;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  color: var(--muted);
  padding: 4px 8px;
}
.field label,
.lbl {
  display: block;
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--faint);
  margin-bottom: 6px;
  font-weight: 600;
}
.hint {
  font-size: 12px;
  color: var(--faint);
  margin-top: 4px;
}
.lanepick {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.lanepick button {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 8px 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  justify-content: center;
  font-size: 12.5px;
}
.lanepick button[aria-pressed="true"] {
  border-color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--ink);
  font-weight: 600;
}
.two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
select,
textarea,
input[type="text"],
input[type="url"],
input[type="date"] {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
  padding: 9px 10px;
}
textarea {
  min-height: 160px;
  resize: vertical;
  line-height: 1.5;
}
.facts {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px 14px;
  font-size: 13px;
}
.facts dt {
  color: var(--faint);
}
.facts dd {
  margin: 0;
  overflow-wrap: anywhere;
}
.mono {
  font-family: var(--mono);
  font-size: 12.5px;
}
.saved {
  font-size: 12px;
  color: var(--faint);
  min-height: 1em;
}
.danger {
  color: var(--danger);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  font-size: 13px;
}
.confirm {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 13px;
}
.toast {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--ink);
  color: var(--bg);
  border-radius: 10px;
  padding: 9px 12px;
  display: flex;
  gap: 14px;
  align-items: center;
  z-index: 20;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
  font-size: 13px;
  max-width: calc(100% - 32px);
}
.toast button {
  background: none;
  border: 0;
  color: inherit;
  font-weight: 600;
  text-decoration: underline;
  cursor: pointer;
  padding: 0;
}
.notice {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 16px;
  color: var(--muted);
  max-width: 60ch;
}

@media (max-width: 900px) {
  .tabs {
    display: flex;
  }
  .board {
    grid-template-columns: 1fr !important;
    overflow: visible;
  }
  .lane {
    display: none;
  }
  .lane.active {
    display: flex;
  }
  .lane-h {
    display: none;
  }
  .item {
    grid-template-columns: 1fr;
  }
  .item .acts {
    grid-row: auto;
    grid-column: 1;
    justify-content: flex-start;
  }
}
@media (prefers-reduced-motion: no-preference) {
  .card {
    transition: border-color 0.15s;
  }
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: center;
  margin-bottom: 12px;
}
.toolbar input[type="search"] {
  flex: 1;
  min-width: 180px;
  max-width: 360px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  padding: 7px 10px;
}
.status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: var(--muted);
  flex-wrap: wrap;
}
.status .sdot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--l-slate);
  flex: none;
}
.status.ok .sdot {
  background: var(--l-green);
}
.status.warn .sdot {
  background: var(--l-amber);
}
.status.bad .sdot {
  background: var(--danger);
}
.status .snote {
  color: var(--ink);
}
.status .snote::before {
  content: "· ";
  color: var(--muted);
}
.quick {
  margin-left: auto;
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  cursor: pointer;
  color: var(--ink);
}
.quick:hover {
  border-color: var(--faint);
}
.foot {
  margin-top: 28px;
  color: var(--faint);
  font-size: 12px;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: center;
}
.nohit {
  color: var(--faint);
  font-size: 13px;
  margin: 0 0 10px;
}

[hidden] {
  display: none !important;
}
.banner {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: center;
  justify-content: space-between;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 14px;
  font-size: 13.5px;
}
.banner .acts {
  display: flex;
  gap: 8px;
}
kbd {
  font-family: var(--mono);
  font-size: 12px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 1px 6px;
  background: var(--surface-2);
  white-space: nowrap;
}
.foot .linkbtn {
  font-size: 12px;
}
.lane-more {
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 12.5px;
  padding: 4px 2px;
  cursor: pointer;
  text-align: left;
}
.lane-more:hover {
  color: var(--ink);
}
.removed {
  margin: 12px 2px 0;
  font-size: 12.5px;
  color: var(--muted);
}
.removed summary {
  cursor: pointer;
}
.removed .rnote {
  padding: 6px 0;
  color: var(--faint);
}
.removed .rrow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-top: 1px solid var(--line);
}
.removed .rrow span {
  min-width: 0;
  overflow-wrap: anywhere;
}
.lane-div {
  font-family: var(--sans);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
  border-top: 1px solid var(--line);
  margin: 10px 2px 2px;
  padding-top: 8px;
}
.pin {
  border: 0;
  background: none;
  cursor: pointer;
  color: var(--faint);
  font-size: 15px;
  line-height: 1;
  padding: 0 2px;
  margin-left: auto;
}
.pin[aria-pressed="true"] {
  color: var(--l-amber);
}
.card .co {
  display: flex;
  align-items: center;
  gap: 6px;
}
.tag.new {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: transparent;
  font-family: var(--sans);
  font-weight: 600;
}
.tag.warn {
  background: var(--warn-bg);
  color: var(--warn-ink);
  border-color: transparent;
  font-family: var(--sans);
}
.tag.docok {
  color: var(--l-green);
  border-color: var(--l-green);
  font-weight: 600;
}
.tag.docmiss {
  color: var(--danger);
  border-color: var(--danger);
  font-weight: 600;
}
.docbtns {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 4px 10px;
  cursor: pointer;
  font-size: 12.5px;
}
.chip[aria-pressed="true"] {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--bg);
}
.logrow {
  display: flex;
  gap: 8px;
}
.logrow input {
  flex: 1;
}
details.edit summary {
  cursor: pointer;
  color: var(--muted);
  font-size: 13px;
}
details.edit[open] summary {
  margin-bottom: 10px;
}
details.edit .field + .field {
  margin-top: 10px;
}
.todo .edit-t {
  grid-column: 2;
  margin-top: 6px;
}
.nav .short {
  display: none;
}
@media (max-width: 600px) {
  .nav {
    flex-wrap: wrap;
    overflow: visible;
  }
  .nav button {
    padding: 8px 8px 9px;
  }
  .nav .long {
    display: none;
  }
  .nav .short {
    display: inline;
  }
  .tabs {
    flex-wrap: wrap;
    overflow: visible;
  }
  .toolbar input[type="search"] {
    max-width: none;
  }
}

.badge.new {
  background: var(--accent-soft);
  color: var(--accent);
}
.todo .t {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.todo .t .tt {
  flex: 1;
}
.todo .t .chev {
  color: var(--faint);
  font-size: 14px;
  line-height: 1;
}
.todo .src {
  display: flex;
  gap: 8px;
  align-items: center;
}
details.waiting {
  margin: -6px 0 4px;
}
details.waiting summary {
  cursor: pointer;
  color: var(--muted);
  font-size: 13px;
}
details.waiting .wlist {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 12px;
}
details.waiting .wrow {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: baseline;
  flex-wrap: wrap;
}
details.waiting .wrow .what {
  font-weight: 600;
  cursor: pointer;
}
details.waiting .wrow .why {
  color: var(--muted);
  font-size: 12.5px;
}
.lblrow {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}
.lblrow label {
  margin-bottom: 0;
}
@media (max-width: 900px) {
  .tabs {
    flex-wrap: wrap;
    overflow: visible;
  }
  .lanepick {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (max-width: 600px) {
  .nav .badge.count {
    display: none;
  }
  .nav button {
    font-size: 13px;
    padding: 8px 7px 9px;
  }
}

.banner.warnb {
  background: var(--warn-bg);
  border-color: var(--l-amber);
}
.viewonly #addBtn,
.viewonly .quick,
.viewonly .pin,
.viewonly .addrow,
.viewonly .item .acts button {
  display: none !important;
}

/* Restore a backup… */
.drawer.restore .rlist {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 10px 0;
}
.drawer.restore .rrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-2);
}
.drawer.restore .rrow small {
  display: block;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.drawer.restore .racts {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  font-size: 13px;
}

/* Prep sheets, the notes pad, quick open and the Prep library. */
/* Same theme rules as board.css: the system setting, unless data-theme="light" or "dark" is set on <html>. */
:root {
  --ex: #6b5b95;
  --note: #fffceb;
  --todo: #b7791f;
  --flash: #fff1b8;
  --ask: #eef3fd;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ex: #b9a7e6;
    --note: #23211a;
    --todo: #e0a640;
    --flash: #4a4222;
    --ask: #1d2740;
  }
}
:root[data-theme="dark"] {
  --ex: #b9a7e6;
  --note: #23211a;
  --todo: #e0a640;
  --flash: #4a4222;
  --ask: #1d2740;
}
.tag.hcall {
  background: var(--warn-bg);
  color: var(--warn-ink);
  font-weight: 600;
}
.tag.hprep {
  background: var(--accent-soft);
  color: var(--accent);
}
.muted {
  color: var(--muted);
}
/* markdown content */
.hs {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  margin: 0 0 12px;
  scroll-margin-top: 8px;
}
.hs.flash {
  background: var(--flash);
  transition: background 0.6s;
}
.hs[hidden],
.hq[hidden] {
  display: none;
}
.hs-h {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 8px;
  font-size: 12.5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
}
.hs-h > span:first-child {
  flex: 1;
}
.hq {
  border-top: 1px solid var(--line);
  padding: 10px 0 4px;
}
.hs > .hq:first-of-type {
  border-top: 0;
  padding-top: 2px;
}
.hq h4 {
  display: flex;
  gap: 8px;
  align-items: baseline;
  margin: 0 0 6px;
  font-size: 15px;
}
.hq h4 > span:first-child {
  flex: 1;
}
.hq.sub h4 {
  font-size: 14px;
}
.hs p {
  margin: 6px 0;
}
.hs ul,
.hs ol {
  margin: 6px 0;
  padding-left: 22px;
}
.hs li {
  margin: 3px 0;
}
.hs h5 {
  margin: 10px 0 4px;
  font-size: 13.5px;
}
blockquote.say {
  position: relative;
  margin: 8px 0;
  padding: 8px 104px 8px 12px;
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  border-radius: 0 8px 8px 0;
  font-size: 15px;
  line-height: 1.55;
}
blockquote.say p {
  margin: 4px 0;
}
.hcopy {
  font: inherit;
  font-size: 11.5px;
  text-transform: none;
  letter-spacing: 0;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  border-radius: 6px;
  padding: 1px 8px;
  cursor: pointer;
  flex: none;
}
.hcopy:hover {
  color: var(--ink);
}
.hcopy.ok {
  color: var(--l-green);
  border-color: var(--l-green);
}
.qcopy {
  position: absolute;
  top: 6px;
  right: 6px;
}
em.ex {
  color: var(--ex);
  font-style: italic;
}
em.ex::before {
  content: "Example · ";
  font-style: normal;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  opacity: 0.85;
}
.ex-mark {
  color: var(--ex);
  font-weight: 700;
}
.todo-mark {
  color: var(--todo);
  font-weight: 700;
}
details.fold {
  margin: 8px 0;
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 4px 10px;
}
details.fold > summary {
  cursor: pointer;
  color: var(--accent);
  font-size: 13.5px;
}
details.mine {
  margin: 6px 0 4px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 4px 10px;
  background: var(--bg);
}
details.mine > summary {
  cursor: pointer;
  color: var(--muted);
  font-size: 13px;
}
/* "Their answer" ({.ask} on a prep sheet): open from the start, with a light highlight */
details.mine.ask {
  background: var(--ask);
  border-left: 3px solid var(--accent);
}
details.mine.ask > summary {
  color: var(--ink);
  font-weight: 600;
}
details.mine.ask textarea {
  min-height: 80px;
}
details.mine textarea {
  width: 100%;
  margin-top: 6px;
  font: inherit;
  font-size: 14px;
  background: var(--note);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 8px;
}
.tbl {
  overflow-x: auto;
}
.tbl table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13.5px;
}
.tbl th,
.tbl td {
  border-bottom: 1px solid var(--line);
  padding: 5px 8px;
  text-align: left;
  vertical-align: top;
}
.tbl th {
  color: var(--muted);
  font-weight: 600;
}

/* {.pay} sections: blurred until you press H, only when blurPay is on in the settings */
.paynote {
  font-size: 11px;
  text-transform: none;
  letter-spacing: 0;
  color: var(--warn-ink);
  background: var(--warn-bg);
  border-radius: 10px;
  padding: 1px 8px;
}
body.showpay .paynote {
  display: none;
}
body.blurpay:not(.showpay) .pay > *:not(h3):not(h4) {
  filter: blur(6px);
  user-select: none;
}
body.blurpay:not(.showpay) .pay {
  cursor: pointer;
}
.paynote-s {
  display: block;
  font-size: 13px;
  color: var(--warn-ink);
}
/* ===== prep sheet (the wide drawer) ===== */
.drawer.prep {
  width: min(1240px, 100vw);
  padding: 0;
  gap: 0;
  overflow: hidden;
  background: var(--bg);
}
.ph {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 10px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
}
.ph .close {
  position: absolute;
  top: 8px;
  right: 10px;
}
.ptitle h2 {
  font-size: 17px;
}
.ptitle .sub {
  display: inline;
  margin-right: 10px;
  font-size: 13px;
}
.pstrip {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  font-size: 13px;
}
.pcall {
  font-size: 13.5px;
}
.callbox {
  margin: 0;
}
.callbox > summary {
  cursor: pointer;
  color: var(--accent);
  font-size: 12.5px;
  width: max-content;
}
.callbox[open] > summary {
  margin-bottom: 6px;
}
.callrow {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.callrow select {
  width: 150px;
}
.callrow input[type="datetime-local"] {
  width: 195px;
}
.callrow select,
.callrow input {
  font: inherit;
  font-size: 13px;
  padding: 3px 6px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  color: var(--ink);
  min-width: 0;
  margin: 0;
}
.callrow input[type="text"] {
  flex: 1 1 150px;
}
.prow {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  align-items: center;
}
.prow .docbtns {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.pstage,
.pnext {
  margin: 0;
}
.pstage .lbl {
  display: none;
}
.pnext.two {
  display: flex;
  gap: 10px;
  align-items: center;
  margin: 0;
  grid-template-columns: none;
}
.pnext .field {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 6px;
}
.pnext label {
  font-size: 12px;
  margin: 0;
  text-transform: none;
  letter-spacing: 0;
  color: var(--muted);
}
.pnext input {
  font-size: 13px;
  padding: 3px 6px;
  width: auto;
  margin: 0;
}
.prow .docbtns .btn {
  padding: 3px 9px;
  font-size: 13px;
}
.pstage .lanepick {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.pstage .lanepick button {
  font-size: 12px;
  padding: 2px 8px;
}
.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
}
.pills a,
.pills .plib {
  font: inherit;
  font-size: 12.5px;
  color: var(--accent);
  text-decoration: none;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1px 9px;
  background: var(--surface);
  cursor: pointer;
  white-space: nowrap;
}
.pills .plib.on {
  background: var(--accent);
  color: var(--on-accent);
  border-color: var(--accent);
}
.pills kbd {
  font-size: 10px;
  margin-right: 4px;
  color: var(--muted);
  border: 0;
  padding: 0;
  background: none;
}
.pills .plib.on kbd {
  color: inherit;
}
.psep {
  flex: 0 0 6px;
}
.pfilter {
  margin-left: auto;
  width: 170px;
  font: inherit;
  font-size: 13px;
  padding: 3px 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
}
.pgrid {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 380px;
  grid-template-rows: minmax(0, 1fr);
}
.pleftwrap {
  overflow-y: auto;
  padding: 12px 14px 40px;
  min-height: 0;
}
.pright {
  border-left: 1px solid var(--line);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 10px 12px;
  gap: 6px;
}
.prh {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.prh .muted {
  flex: 1;
  font-size: 13px;
  min-width: 60px;
}
.pad {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  gap: 4px;
}
.pad textarea {
  flex: 1;
  min-height: 180px;
  resize: none;
  background: var(--note);
  color: var(--ink);
  font:
    14px/1.5 ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
}
.padstat {
  font-size: 12px;
  display: flex;
  gap: 8px;
  align-items: center;
  color: var(--muted);
}
.padstat.ok {
  color: var(--l-green);
}
.padstat.warn {
  color: var(--warn-ink);
}
.padstat.bad {
  background: var(--warn-bg);
  color: var(--danger);
  border-radius: 6px;
  padding: 4px 8px;
  font-weight: 600;
}
.pwhere {
  font-size: 11.5px;
  color: var(--muted);
}
.prepbar {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--warn-bg);
  color: var(--warn-ink);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 10px;
  margin-bottom: 10px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.prepbar[hidden] {
  display: none;
}
.hs.asks ol {
  margin: 0;
}
.cardmore {
  margin-top: 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  padding: 8px 12px;
}
.cardmore > summary {
  cursor: pointer;
  color: var(--muted);
  font-size: 13px;
}
.cardmore > *:not(summary) {
  margin-top: 10px;
}
.plibbar {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
  flex-wrap: wrap;
  font-size: 13px;
}
/* half a screen next to a video call: one column, notes docked at the bottom */
@media (max-width: 900px) {
  .drawer.prep {
    width: 100vw;
  }
  .ph {
    padding: 8px 10px 6px;
    gap: 3px;
  }
  .ptitle h2 {
    font-size: 15px;
  }
  .ptitle .sub:not(#dSub) {
    display: none;
  }
  .pstrip > span.muted {
    display: none;
  }
  .callrow {
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .callrow input[type="text"] {
    flex: none;
    width: 130px;
  }
  .prow,
  .pills {
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 1px;
  }
  .prow::-webkit-scrollbar,
  .pills::-webkit-scrollbar,
  .callrow::-webkit-scrollbar {
    display: none;
  }
  .pstage .lanepick {
    flex-wrap: nowrap;
  }
  .pstage .lanepick button,
  .prow .docbtns .btn {
    white-space: nowrap;
    font-size: 12px;
    padding: 2px 8px;
  }
  .prow .docbtns {
    flex-wrap: nowrap;
  }
  .pfilter {
    flex: none;
    width: 120px;
  }
  .pgrid {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1fr) 32vh;
  }
  .pright {
    border-left: 0;
    border-top: 2px solid var(--accent);
    padding: 6px 10px;
  }
  .pad textarea {
    min-height: 0;
  }
  details.mine textarea {
    min-height: 64px;
  }
  .pwhere {
    display: none;
  }
  .pleftwrap {
    padding: 8px 8px 30px;
  }
  blockquote.say {
    font-size: 14.5px;
    padding-right: 12px;
  }
  /* on a narrow screen the Copy answer button sits above the text instead of over it */
  .qcopy {
    position: static;
    float: right;
    margin: 0 0 4px 8px;
  }
}
/* ===== quick open ===== */
.hqo {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 12vh;
}
.hqscrim {
  position: absolute;
  inset: 0;
  background: rgba(10, 14, 22, 0.4);
}
.hqbox {
  position: relative;
  width: min(640px, 94vw);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
  overflow: hidden;
}
.hqbox input {
  width: 100%;
  font: inherit;
  font-size: 16px;
  padding: 12px 14px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  outline: none;
}
.hqlist {
  max-height: 50vh;
  overflow-y: auto;
}
.hqi {
  padding: 8px 14px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0 10px;
  cursor: pointer;
  border-bottom: 1px solid var(--line);
}
.hqi.on,
.hqi:hover {
  background: var(--accent-soft);
}
.hqi span {
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hqi small {
  grid-column: 1/3;
  color: var(--muted);
  font-size: 12px;
}
.hqhint {
  padding: 6px 14px;
  font-size: 12px;
  color: var(--muted);
}
kbd {
  font:
    11px ui-monospace,
    monospace;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 5px;
  background: var(--surface);
  color: var(--muted);
}
/* ===== Next up: upcoming calls ===== */
.hup {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--l-amber);
  border-radius: 10px;
  padding: 10px 14px;
  margin: 0 0 14px;
}
.hup-h {
  font-weight: 700;
  margin-bottom: 6px;
}
.hup-r {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
  padding: 4px 0;
}
.hup-t {
  font-weight: 600;
  min-width: 150px;
}
.hup-w {
  flex: 1;
  min-width: 200px;
}
.hup-k {
  color: var(--muted);
  font-size: 13px;
}
/* ===== Prep library tab ===== */
.hlib {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr) 190px;
  gap: 0;
  align-items: start;
}
.hlnav {
  position: sticky;
  top: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  max-height: calc(100vh - 24px);
  overflow-y: auto;
}
.hlsearch {

  const out = [];

  out.sort((a, b) => a.x.followUp.localeCompare(b.x.followUp));

/* ================= writes (every write stamps updatedAt and who changed it) ================= */

  setTimeout(render, 0);

  if (blockedEdit()) return;

  if (blockedEdit()) return;
  const x = get(sec, id);
  if (!x || laneKey(sec, x) === lane) return;
  const L = laneOf(sec, lane);
  const keys = ["lane", "movedAt", "followUp", "appliedAt", "sentResume", "closedReason"];
  const before = Object.fromEntries(keys.map((k) => [k, x[k] ?? null]));
  const patch = { lane, movedAt: nowIso(), followUp: L.follow ? addDays(L.follow) : null };
  if (!L.done) patch.closedReason = null;
  if (sec === "jobs") {
    if (lane === "applied" && !x.appliedAt) {
      patch.appliedAt = nowIso();
      if (x.resume && !x.sentResume) patch.sentResume = x.resume;
    }
    if (lane === "todo") {
      patch.appliedAt = null;
      patch.sentResume = null;
    }
  }

  render();
  if (openRef && openRef.sec === sec && openRef.id === id) openDrawer(sec, id, true);

  let msg = `${SECTIONS[sec].title(x)} → ${L.name}${patch.followUp ? ` · follow up ${fmtDate(patch.followUp)}` : ""}`;
  if (sec === "jobs" && lane === "applied") {

  if (!dirHandle) return "none";
  let t;
  lastRaw = "";
  lastMeta = "";
  try {
    const fh = await dirHandle.getFileHandle(DATA_FILE);
    const f = await fh.getFile();
    lastMeta = metaOf(f);
    t = await f.text();
  } catch (e) {
    return "missing";
  }

  if (!t.trim()) return "missing";

  if (t === syncedText) return "ok";

  try {
    const raw = parseDataText(t);
    extras = Object.create(null);
    keepExtras(raw);
    const n = normalize(raw);
    const next = copyStore(store);
    for (const c of COLLS)
      for (const id of Object.keys(n[c])) {
        const k = c + ":" + id,
          r = n[c][id];
        /* unchanged since the last read or write: nothing to merge */
        if (fileRecs[k] && sameRec(fileRecs[k], r)) continue;
        next[c][id] = mergeFile(k, next[c][id], r, stale);
        rememberFile(k, r);
        fileRecs[k] = r;

async function keepOlder(raw, n) {

    try {

      const name = `${DATA_FILE.replace(/\.js$/, "")}_older_${TODAY()}.js`;
      let exists = true;
      try {
        await bdir.getFileHandle(name);
      } catch (e) {
        exists = false;
      }
      if (!exists) {
        const w = await (await bdir.getFileHandle(name, { create: true })).createWritable();
        await w.write(raw);

  wrapperWarned = t;

  try {

async function writeFile() {
  if (!dirHandle || !canWrite) {

    return;
  }
  if (writing) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(writeFile, 300);
    return;
  }
  writing = true;
  try {
    const g = gen;
    const r = await readFileInto();
    if (r === "bad") {
      saveErr = "bad";
    } else {
      await dailyBackup(lastRaw);
      /* What is written is a copy taken now: an edit made while the file is being written is not in the file, so it
         must not count as what the file holds. Right before writing, the file is checked again: when another tool
         wrote it since the read, it is merged first (up to three times). */
      let snap, w, fh;
      for (let tries = 0; ; tries++) {
        snap = copyStore(store);
        fh = await dirHandle.getFileHandle(DATA_FILE, { create: true });
        w = await fh.createWritable();
        if (tries >= 3 || !lastMeta || metaOf(await fh.getFile()) === lastMeta) break;
        try {
          await w.abort();
        } catch (e) {}
        if ((await readFileInto()) === "bad") throw new Error("bad");

      const text = serialize(snap);
      await w.write(text);
      await w.close();
      syncedText = text;
      lastMeta = metaOf(await fh.getFile());
      for (const c of COLLS)
        for (const id of Object.keys(snap[c]))
          if (fileRecs[c + ":" + id] !== snap[c][id]) rememberFile(c + ":" + id, snap[c][id]);
      setFileRecs(snap);

      lastSaved = new Date();

      else {
        /* changed while writing (an edit, another tab's copy): write again */
        dirty = true;
        clearTimeout(saveTimer);
        saveTimer = setTimeout(writeFile, 400);
      }
      setTimeout(fileJobs, 50);
      myResume();
    }
  } catch (e) {
    if (e && e.name === "NotFoundError") {
      dirHandle = null;
      canWrite = false;
      saveErr = "";
      await idbSet("dir", null);
      showToast("Couldn't find your board folder. It may have been moved. Click Turn on saving and pick it again.");
    } else {
      saveErr = e && e.message === "bad" ? "bad" : "write";

/* Before the first save of each day, keep the file exactly as it was (including anything another tool wrote). */

  try {
    const bdir = await dirHandle.getDirectoryHandle("backups", { create: true });
    const base = DATA_FILE.replace(/\.js$/, "");
    const name = `${base}_${day}.js`;
    let exists = true;
    try {
      await bdir.getFileHandle(name);
    } catch (e) {
      exists = false;
    }
    if (!exists) {
      const fh = await bdir.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(rawBefore);
      await w.close();
    }
    backedUpDay = day;
    /* the daily copies, the older copies kept by a merge and the copies saved before a restore: the newest few of each */
    const esc = base.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

    for await (const [n, h] of bdir.entries())
      if (h.kind === "file") kinds.forEach((re, i) => re.test(n) && names[i].push(n));
    for (const list of names) {
      list.sort();
      for (const n of list.slice(0, Math.max(0, list.length - CONFIG.backups.boardDays)))
        try {
          await bdir.removeEntry(n);
        } catch (e) {}
    }
  } catch (e) {}
}

    t = await (await (await dirHandle.getFileHandle(DATA_FILE)).getFile()).text();

/* ================= filing each job's documents folder by stage =================
   A job's folder lives in <board folder>/<stage folder>/<job folder>. When a card changes lane the page moves the folder
   (copy every file, check sizes, then remove the old copy) and updates "folder", so the Résumé and Cover letter buttons keep working.
   The folder is looked for at its "folder" path and under each stage folder by its name (where a tool or a person may
   have moved it); a folder anywhere else is not searched for. */

   folders like any other. */

  if (typeof f !== "string" || !f.trim()) return "it's empty";
  if (/^[\\/]|^[A-Za-z]:|^~/.test(f)) return "it's an absolute path";
  f = canonFolder(f);
  if (f.includes("\\")) return "it has a backslash (use / between folders)";
  const segs = f.split("/");
  if (segs.some((x) => !x.trim() || x === "." || x === "..")) return "it has an empty, . or .. part";
  if (RESERVED_DIRS.some((r) => sameName(r, segs[0]))) return `it points into ${segs[0]}/`;
  if (segs.length === 1 && BOARD_FILES.some((n) => sameName(n, segs[0]))) return "it names one of the board's files";
  const { name } = splitFolder(f);

  for (const [n, h] of list) {
    if (h.kind === "file") {
      const f = await h.getFile();
      const o = await dst.getFileHandle(n, { create: true });
      const w = await o.createWritable();
      await w.write(f);
      await w.close();
      if ((await (await dst.getFileHandle(n)).getFile()).size !== f.size) throw new Error("copy check failed: " + n);
    } else {

  const parts = to.split("/"),

  };
  try {
    for (const [id, x] of Object.entries(store.jobs)) {
      if (!x || !x.folder) {
        filedSig.delete(id);
        continue;
      }
      const sig = fileSig(x);
      const removedWaiting = x.deleted && splitFolder(x.folder).stage === REMOVED_DIR;
      if (!all && filedSig.get(id) === sig && !(purge && removedWaiting)) continue;
      filedSig.set(id, sig);
      const why = badFolder(x.folder);
      if (why) {
        const k = id + "|" + x.folder;
        if (!badWarned.has(k)) {
          badWarned.add(k);
          bad.push(`${x.company || id} (“${x.folder}”: ${why})`);
        }
        continue;
      }
      const want = x.deleted ? REMOVED_DIR : STAGE_DIR[laneKey("jobs", x)];
      if (!want) continue;
      const { stage, name } = splitFolder(x.folder);
      /* A removed card's files wait in the removed folder (Restore brings them back), then are deleted for good. */
      if (removedWaiting) {
        if (!purge) continue;
        const since = Date.parse(x.removedAt || x.updatedAt || "");
        if (since && Date.now() - since > PURGE_DAYS * 864e5) {
          try {
            await (await dirAt(REMOVED_DIR)).removeEntry(name, { recursive: true });
          } catch (e) {
            if (!e || e.name !== "NotFoundError") {
              fail(id, x, name);
              continue;
            }
          }
          const r = store.jobs[id];
          setRec("jobs", id, { ...r, folder: null, filesDeletedAt: nowIso(), updatedAt: stamp(r), changedBy: "you" });
          filedSig.delete(id);
          persist();
        }
        continue;
      }
      if (stage === want) {
        failWarned.delete(id);
        continue;
      }
      const target = want + "/" + name;
      try {
        let from = null;
        for (const c of [x.folder, ...STAGE_DIRS.map((s) => s + "/" + name)])
          if (c !== target && !inside(target, c) && !inside(c, target) && (await hasDir(c))) {
            from = c;
            break;
          }
        const there = await hasDir(target);
        if (from && there) {
          fail(id, x, name);
          continue;
        }
        if (from) {
          await moveDir(from, target);
          moved.push(x.company || name);
        } else if (!there) {
          fail(id, x, name);
          continue;
        }
        const r = store.jobs[id];
        setRec("jobs", id, { ...r, folder: target, updatedAt: stamp(r), changedBy: "you" });
        filedSig.set(id, fileSig(store.jobs[id]));
        failWarned.delete(id);
        rescan.push(target);
        persist();
      } catch (e) {
        fail(id, x, name);
      }
    }
    if (purge) purgedDay = TODAY();
  } finally {
    filing = false;
  }
  if (moved.length || failed.length || bad.length) render();
  /* only the folders that moved are listed again (every folder is listed when you come back to the window) */
  if (rescan.length) scanFolders(true, rescan);
  if (bad.length)
    showToast(
      `Didn't move the folder for ${bad.join("; ")}. A job's "folder" must be its own folder, such as “${STAGE_DIR.todo}/Acme - Engineer”. Nothing was moved.`,
    );
  else if (failed.length && !lastUndo)
    showToast(`Couldn't file the folder for ${failed.join(", ")}. Nothing was lost; check the stage folders.`);
  else if (moved.length > 1 && !lastUndo) showToast(`Filed ${moved.length} job folders by stage.`);
  if (fileAgain) {
    fileAgain = false;
    setTimeout(fileJobs, 50);
  }
}

/* Handles are stored per board folder, so a sample board and your real board never share one. */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(lsKey("handles"), 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) {
  try {
    const d = await idb();
    return await new Promise((res) => {
      const q = d.transaction("kv").objectStore("kv").get(k);
      q.onsuccess = () => res(q.result);
      q.onerror = () => res(null);
    });
  } catch (e) {
    return null;
  }
}
async function idbSet(k, v) {
  try {
    const d = await idb();
    await new Promise((res) => {
      const t = d.transaction("kv", "readwrite");
      t.objectStore("kv").put(v, k);
      t.oncomplete = res;
      t.onerror = res;
    });
  } catch (e) {}
}
async function connectFolder() {
  if (!FS_OK) return;
  try {
    const h = await window.showDirectoryPicker({ id: CONFIG.pickerIds.board, mode: "readwrite" });
    let fresh = false;
    try {
      await h.getFileHandle(DATA_FILE);
    } catch (e) {
      /* A new board: an empty folder is fine, the data file is created. A folder with other files needs the page next to it. */
      let other = false;
      for await (const [n] of h.entries())
        if (!n.startsWith(".")) {
          other = true;
          break;
        }
      if (other) {
        showToast(
          `Pick the folder this page is in (the one that holds ${DATA_FILE}), or an empty folder to start a new board.`,
        );
        return;
      }
      fresh = true;
    }
    dirHandle = h;
    canWrite = true;
    await idbSet("dir", h);
    const warned = wrapperWarned;
    await writeFile();
    /* a warning about the data file (see checkWrapper) stays up instead of this message */
    if (!saveErr && wrapperWarned === warned)
      showToast(
        fresh
          ? `Saving is on. ${DATA_FILE} was created in “${h.name}”; keep this page in that folder.`
          : "Saving to your folder is on. Job folders now move by themselves when a job changes stage.",
      );
  } catch (e) {
    if (!e || e.name !== "AbortError") showToast("Couldn't open that folder. Try again.");
  }
}
async function allowAgain() {
  if (!dirHandle) return connectFolder();
  try {
    const p = await dirHandle.requestPermission({ mode: "readwrite" });
    canWrite = p === "granted";
    if (canWrite) await writeFile();
    else renderStatus();
  } catch (e) {
    connectFolder();
  }
}

let toastTimer = null;

/* ================= render (the whole view is rebuilt; focus and scroll are put back) ================= */
function focusKey() {
  const a = document.activeElement;
  if (!a || a === document.body) return null;
  if (a.id && !/^td-/.test(a.id)) return { id: a.id };
  const host = a.closest("[data-key]");
  if (!host) return null;
  const all = [...document.querySelectorAll("[data-key]")];
  const i = all.indexOf(host);
  return {
    key: host.dataset.key,
    f: a.dataset.f || null,
    next: all[i + 1] ? all[i + 1].dataset.key : null,
    prev: all[i - 1] ? all[i - 1].dataset.key : null,
  };
}
function restoreFocus(k) {
  if (!k) return;
  if (k.id) {
    const n = document.getElementById(k.id);
    if (n && n !== document.activeElement) {
      n.focus({ preventScroll: true });
      if (n.setSelectionRange && typeof n.value === "string")
        try {
          n.setSelectionRange(n.value.length, n.value.length);
        } catch (e) {}
    }
    return;
  }
  const shown = (n) => n.getClientRects().length > 0 && !n.closest("details:not([open])");
  const find = (key) => key && [...document.querySelectorAll(`[data-key="${CSS.escape(key)}"]`)].find(shown);
  const host = find(k.key) || find(k.next) || find(k.prev);
  if (!host) return;
  const target =
    (k.f && host.querySelector(`[data-f="${CSS.escape(k.f)}"]`)) ||
    host.querySelector('[data-f="cb"],[data-f="open"]') ||
    host;
  if (target.tabIndex < 0 && !target.matches("a,button,input,textarea")) target.tabIndex = -1;
  target.focus({ preventScroll: true });
}

/* ================= Next up: follow-ups, stale cards, starred jobs, top to-dos, the plan ================= */
const STALE = CONFIG.stale;
function staleList() {
  const out = [];
  for (const sec of BOARDS) {
    const r = STALE[sec];
    if (!r) continue;
    for (const [id, x] of Object.entries(live(sec))) {
      const ln = laneKey(sec, x);
      if (!r.lanes.includes(ln)) continue;
      if (x.keepUntil && x.keepUntil > TODAY()) continue;
      const d = daysSince(x.movedAt);
      if (d >= r.days) out.push({ sec, id, x, d });
    }
  }
  return out.sort((a, b) => b.d - a.d);
}
function applyNextList() {
  return Object.entries(live("jobs"))
    .filter(([, x]) => laneKey("jobs", x) === "todo" && x.pinned)
    .sort(
      (a, b) =>
        String(a[1].pinnedAt || "").localeCompare(String(b[1].pinnedAt || "")) ||
        String(a[1].company).localeCompare(b[1].company),
    );
}
const justAdded = (x) => !!x.addedAt && Date.now() - Date.parse(x.addedAt) < 36 * 3600e3;
/* Plan steps that the boards can answer tick themselves. */
function autoDone(a) {
  if (a === "hunters_registered") {
    const firms = Object.values(live("hunters")).filter((h) => h.tier);
    return firms.length > 0 && firms.every((h) => laneKey("hunters", h) !== "todo");
  }
  if (a === "people10") return Object.keys(live("people")).length >= 10;
  return false;
}
const AUTO = { hunters_registered: 1, people10: 1 };
const isAuto = (p) => typeof p.auto === "string" && Object.hasOwn(AUTO, p.auto);
const planDone = (p) => !!p.done || (isAuto(p) && autoDone(p.auto));
function openRow(sec, id, x, label) {

function followRows(due) {
  const rows = new Map();
  for (const d of due) rows.set(d.sec + ":" + d.id, { ...d, due: true });
  for (const st of staleList()) {
    const k = st.sec + ":" + st.id;
    rows.set(k, { ...(rows.get(k) || st), stale: true, d: st.d });
  }
  return [...rows.values()].sort((a, b) =>
    a.due && b.due ? a.x.followUp.localeCompare(b.x.followUp) : a.due ? -1 : b.due ? 1 : b.d - a.d,

/* ================= the boards (lanes with drag and drop; one lane at a time on narrow windows) ================= */
function sortedCards(sec, lane) {
  const list = Object.entries(live(sec)).filter(([, x]) => laneKey(sec, x) === lane && matches(sec, x));
  if (lane === "todo")
    list.sort(
      (a, b) =>
        (justAdded(b[1]) ? 1 : 0) - (justAdded(a[1]) ? 1 : 0) ||
        (b[1].pinned ? 1 : 0) - (a[1].pinned ? 1 : 0) ||
        (a[1].longShot ? 1 : 0) - (b[1].longShot ? 1 : 0) ||
        (a[1].order ?? 99) - (b[1].order ?? 99) ||
        String(SECTIONS[sec].title(a[1])).localeCompare(SECTIONS[sec].title(b[1])),
    );
  else list.sort((a, b) => String(b[1].movedAt || "").localeCompare(String(a[1].movedAt || "")));
  return list;
}
function renderBoard(v, sec) {

  const counts = {};
  for (const l of S.lanes) counts[l.id] = 0;
  let shown = 0;
  for (const x of Object.values(live(sec)))
    if (matches(sec, x)) {
      counts[laneKey(sec, x)]++;
      shown++;
    }
  if (query && !shown) v.append(el("p", { class: "nohit", text: `Nothing matches “${query}”.` }));
  if (!S.lanes.some((l) => l.id === activeLane[sec])) activeLane[sec] = S.lanes[0].id;
  let shownLane = activeLane[sec];
  if (query && !counts[shownLane]) {
    const hit = S.lanes.find((l) => counts[l.id]);
    if (hit) shownLane = hit.id;
  }
  const tabs = el("div", { class: "tabs", role: "group", "aria-label": "Stages" });
  for (const l of S.lanes)
    tabs.append(
      el(
        "button",
        {
          class: "tab",
          "aria-pressed": String(l.id === shownLane),
          type: "button",
          onclick: () => {
            activeLane[sec] = l.id;
            remember();
            render();
          },
        },
        el("span", { class: "dot", style: `background:${l.color}` }),
        l.name,
        el("span", { class: "n", text: String(counts[l.id]) }),
      ),
    );
  const board = el("div", {
    class: "board",
    style: `grid-template-columns:repeat(${S.lanes.length},minmax(170px,1fr))`,
  });
  for (const l of S.lanes) {
    const cards = el("div", { class: "cards" });
    const list = sortedCards(sec, l.id);
    if (!list.length) {
      const t = query ? "No matches." : (S.empty[l.id] ?? S.empty._);
      if (t) cards.append(el("div", { class: "empty", text: t }));
    }
    /* Every card always shows. Long shots sit at the bottom of "To apply" under a divider. */
    const longN =
      sec === "jobs" && l.id === "todo" ? list.filter(([, x]) => x.longShot && !x.pinned && !justAdded(x)).length : 0;
    let divided = false;
    for (const [id, x] of list) {
      if (longN && !divided && x.longShot && !x.pinned && !justAdded(x)) {
        divided = true;
        cards.append(el("div", { class: "lane-div", text: `Long shots (${longN})` }));
      }
      cards.append(card(sec, id, x));

    /* Removed cards stay recoverable: listed under the last lane with a Restore button. */
    if (l.id === S.lanes[S.lanes.length - 1].id && !query) {
      const gone = Object.entries(store[sec])
        .filter(([, x]) => x && x.deleted)
        .sort((a, b) => String(b[1].updatedAt || "").localeCompare(String(a[1].updatedAt || "")));
      if (gone.length) {
        const box = el(
          "details",
          { class: "removed" },
          el("summary", { text: `Removed cards (${gone.length})` }),
          sec === "jobs"
            ? el("div", {
                class: "rnote",
                text: `Their files wait in “${REMOVED_DIR}” for ${PURGE_DAYS} days, then are deleted. Restore brings a card and its files back.`,
              })
            : null,
        );
        for (const [id, x] of gone)
          box.append(
            el(
              "div",
              { class: "rrow" },
              el("span", { text: [S.title(x), S.sub(x)].filter(Boolean).join(" · ") }),
              el("button", {
                class: "btn small",
                type: "button",
                text: "Restore",
                onclick: () => {
                  upd(sec, id, { deleted: false, removedAt: null });
                  render();
                  showToast(S.title(x) + " restored");

    const lane = el(
      "section",
      {

        ondragover: (e) => {

            lane.classList.add("drop");
          }
        },
        ondragleave: (e) => {
          if (!lane.contains(e.relatedTarget)) lane.classList.remove("drop");
        },
        ondrop: (e) => {
          e.preventDefault();
          lane.classList.remove("drop");
          if (dragRef && dragRef.sec === sec) moveCard(sec, dragRef.id, l.id);
          dragRef = null;
        },
      },
      el(
        "div",
        { class: "lane-h" },
        el("span", { class: "dot", style: `background:${l.color}` }),
        el("span", { class: "name", text: l.name }),
        el("span", { class: "n", text: String(counts[l.id]) }),
      ),
      cards,
    );
    board.append(lane);
  }
  v.append(tabs, board);
}
/* A job's tailored résumé and cover letter live in its folder (see filing). noResume / noLetter mark a package without one;
   resumeFile / letterFile override the file names from the settings. A folder value that isn't a job folder inside
   the board (see badFolder) gets no links. */
const docName = (x, k) =>
  String(x[k === "resume" ? "resumeFile" : "letterFile"] || CONFIG.files[k === "resume" ? "resume" : "coverLetter"]);
const encPath = (p) => String(p).split("/").map(encodeURIComponent).join("/");
function docsOf(x) {
  if (!x || !x.folder || badFolder(x.folder)) return { resume: null, letter: null };
  const base = encPath(x.folder) + "/";
  const ok = (n) => !n.split("/").some((q) => !q || q === "." || q === "..");
  const r = docName(x, "resume"),
    l = docName(x, "letter");
  return {
    resume: x.noResume || !ok(r) ? null : base + encPath(r),
    letter: x.noLetter || !ok(l) ? null : base + encPath(l),
  };
}
/* With saving on, the page also checks that the PDFs are really in the folder. Each folder is listed once and cached,
   and listed again when you come back to the window and after a job folder moves, so drawing the board never waits
   for the disk. Without folder access the tag only reflects the fields, as before. Names are compared the way macOS
   and Windows do (case and Unicode form ignored). */
const folderFiles = new Map(); // folder path -> Set of normalized file names, null when the folder isn't there, "?" unknown
const fileKey = (n) => String(n).normalize("NFC").toLowerCase();
let folderScanT = null,
  folderScanning = false,
  folderScanAgain = false;
async function scanFolders(fresh, only) {
  if (!dirHandle || !canWrite || VIEW_ONLY) return;
  if (folderScanning) {
    folderScanAgain = true;
    return;
  }
  folderScanning = true;
  let changed = false;
  try {
    const want = new Set(
      only ||
        Object.values(live("jobs"))
          .map((x) => x.folder)
          .filter((f) => typeof f === "string" && f && !badFolder(f)),
    );
    for (const f of want) {
      if (!fresh && folderFiles.has(f)) continue;
      let names = null;
      try {
        const d = await dirAt(f);
        names = new Set();
        for await (const [n, h] of d.entries()) if (h.kind === "file") names.add(fileKey(n));
      } catch (e) {
        /* can't read it right now: keep what we knew, or mark it unknown so it isn't tried on every redraw */
        if (!e || e.name !== "NotFoundError") {
          if (!folderFiles.has(f)) folderFiles.set(f, "?");
          continue;
        }
      }
      const old = folderFiles.get(f);
      const same =
        folderFiles.has(f) &&
        (old === names ||
          (old && old !== "?" && names && old.size === names.size && [...names].every((n) => old.has(n))));
      folderFiles.set(f, names);
      if (!same) changed = true;
    }
  } finally {
    folderScanning = false;
  }
  /* with a panel open the board is redrawn when it closes */
  if (changed && !$("#drawerRoot").childNodes.length) render();
  if (folderScanAgain) {
    folderScanAgain = false;
    scanFolders(true);
  }
}
const fileChecks = () => !!(dirHandle && canWrite && !VIEW_ONLY);
function docsTag(x, ln) {
  if (x.folder && badFolder(x.folder)) {
    if (laneOf("jobs", ln).done) return null;
    return el("span", {
      class: "tag docmiss",
      title: `"folder" is “${x.folder}”: ${badFolder(x.folder)}. Set it to the job's own folder.`,
      text: "✗ Check the folder path",
    });
  }
  const d = docsOf(x);
  if (fileChecks() && x.folder) {
    if (!folderFiles.has(x.folder)) {
      clearTimeout(folderScanT);
      folderScanT = setTimeout(() => scanFolders(false), 0);
    } else if (folderFiles.get(x.folder) !== "?") {
      const have = folderFiles.get(x.folder);
      /* a file in a subfolder of the job's folder isn't listed here, so it isn't checked */
      const miss = (k) => !docName(x, k).includes("/") && !(have && have.has(fileKey(docName(x, k))));
      const rMiss = !!d.resume && miss("resume");
      const lMiss = !!d.letter && miss("letter");
      if (rMiss || lMiss) {
        if (laneOf("jobs", ln).done) return null;
        const what = rMiss && lMiss ? "Résumé and cover letter files" : rMiss ? "Résumé file" : "Cover letter file";
        return el("span", {
          class: "tag docmiss",
          title: `Not found in ${x.folder}`,
          text: `✗ ${what} missing`,
        });
      }
    }
  }
  if (d.resume && d.letter)
    return el("span", {
      class: "tag docok",
      title: "Tailored résumé and cover letter are ready (open them from the card)",
      text: "✓ Résumé + letter",
    });
  if (laneOf("jobs", ln).done) return null;
  const miss = !d.resume && !d.letter ? "No résumé or letter" : !d.resume ? "No résumé" : "No cover letter";
  return el("span", { class: "tag docmiss", title: "The tailored package isn't complete yet", text: "✗ " + miss });
}
function card(sec, id, x) {
  const S = SECTIONS[sec];
  const tags = [];
  const ln = laneKey(sec, x);
  const url = sec === "hunters" && x.tier && ln !== "todo" ? null : safeUrl(x.url);
  if (isNewFromTool(sec, id, x)) tags.push(el("span", { class: "tag new", text: "New from " + CONFIG.assistantName }));
  else if (ln === "todo" && justAdded(x)) tags.push(el("span", { class: "tag new", text: "Just added" }));
  if (isDue(sec, x)) {
    const late = Math.round((new Date(TODAY() + "T12:00:00") - new Date(x.followUp + "T12:00:00")) / 864e5);
    tags.push(
      el("span", {
        class: "tag fu",
        text: late > 0 ? `Follow up · ${late} day${late > 1 ? "s" : ""} late` : "Follow up today",
      }),
    );
  } else if (x.followUp && ln !== "todo" && !laneOf(sec, ln).done)
    tags.push(el("span", { class: "tag", title: "Next follow-up", text: "Follow up " + fmtDate(x.followUp) }));
  if (x.closedReason && laneOf(sec, ln).done) tags.push(el("span", { class: "tag", text: x.closedReason }));
  if (sec === "hunters" && x.submittedTo)
    tags.push(
      el("span", { class: "tag", title: "Roles they submitted me for", text: "Submitted for: " + x.submittedTo }),
    );
  if (sec === "jobs" && x.longShot && !laneOf(sec, ln).done)
    tags.push(el("span", { class: "tag", title: "Marked as a long shot", text: "Long shot" }));
  if (sec === "jobs") {
    const dt = docsTag(x, ln);
    if (dt) tags.push(dt);
  }
  if (sec === "jobs" || sec === "hunters") {
    try {
      tags.push(...Prep.cardTags(sec, id, x));
    } catch (e) {}
  }
  if (sec === "jobs" && personName(x.referralId))
    tags.push(el("span", { class: "tag", title: "Referral", text: "Referral: " + personName(x.referralId) }));
  if (sec === "people") {

  }
  if (sec === "jobs" && ln === "todo") {

    contacted: "Mark reached out",
    asked: "Mark asked",
  };
  if (nextLane) {
    const L = laneOf(sec, nextLane);
    quick = el("button", {

      ? el("button", {

          type: "button",

          "aria-pressed": String(!!x.pinned),

            render();

          },

  const c = el(

      onkeydown: (e) => {

document.addEventListener("keydown", (e) => {

  const typing = document.activeElement.matches(
    "textarea,select,input:not([type=checkbox]):not([type=radio]),[contenteditable]",
  );
  /* Esc: in a prep sheet the first press leaves a text box, the second closes the panel */

      Prep.leaveField(document.activeElement);
      return;
    }

    return;
  }
  if (drawerOpen && e.key === "Tab") {
    const box = $("#drawerRoot .drawer");
    const f = [...box.querySelectorAll("a[href],button,input,textarea,select,summary")].filter(
      (n) => !n.disabled && n.offsetParent !== null,
    );
    if (f.length) {
      const first = f[0],
        last = f[f.length - 1];
      const a = document.activeElement;
      if (e.shiftKey && (a === first || a === box || !box.contains(a))) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && (a === last || !box.contains(a))) {
        e.preventDefault();
        first.focus();

  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === "z" && !typing && lastUndo) {
    e.preventDefault();

/* ---- 80-markdown.js ---- */
/* ================= Markdown for guides and prep sheets =================
   A small subset, plus four markers:
     ✎  an answer you haven't confirmed yet (shows a "My version" box in guides and prep sheets)
     ☐  a fact you still need to find out
     *<…>*  an example answer: shown in a different color, left out when you copy
     ::: fold Title … :::  a collapsible block ("::: fold + Title" starts open)
     {.pay} at the end of a ## or ### heading marks a pay section (optionally blurred until you press H)
     {.ask} anywhere in a ### heading of a prep sheet adds an open "Their answer" box (stripped everywhere else)
   Structure: "# Title", "## Section" (a card), "### Question" (a block inside the card). */
const $q = (s, r) => (r || document).querySelector(s),
  $qa = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const slug = (s) =>
  String(s)
    .toLowerCase()
    .replace(/<[^>]+>/g, "")
    .replace(/&[a-z]+;/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "")
    .slice(0, 48) || "s";
const nowStamp = () => new Date().toISOString().replace(/[:.]/g, "-").slice(0, 23);
const hhmm = (d) => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const cssId = (s) => String(s).replace(/([^\w-])/g, "\\$1");

/* Inline markup. Input is escaped first, so a guide can never inject HTML; only http(s) links become links. */
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/\*([^*]+)\*/g, (m, t) =>
    t.startsWith("&lt;") ? `<em class="ex" title="Example only: don't say as written">${t}</em>` : `<em>${t}</em>`,
  );
  s = s.replace(
    /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>',
  );
  s = s
    .replace(/☐/g, '<span class="todo-mark" title="A fact you still need to get">☐</span>')
    .replace(/✎/g, '<span class="ex-mark" title="Not confirmed yet: examples only">✎</span>');
  return s;
}
function blocks(lines) {
  let h = "",
    i = 0;
  const para = [];
  const flush = () => {
    if (para.length) {
      h += `<p>${para.map(inline).join("<br>")}</p>`;
      para.length = 0;
    }
  };
  while (i < lines.length) {
    const l = lines[i];
    if (/^:::\s*fold\s*/.test(l)) {
      flush();
      let t = l.replace(/^:::\s*fold\s*/, "");
      const openIt = /^\+\s/.test(t);
      t = t.replace(/^\+\s+/, "");
      const inner = [];
      i++;
      while (i < lines.length && !/^:::\s*$/.test(lines[i])) inner.push(lines[i++]);
      i++;
      h += `<details class="fold"${openIt ? " open" : ""}><summary>${inline(t)}</summary>${blocks(inner)}</details>`;
      continue;
    }
    if (/^\s*\|/.test(l)) {
      flush();
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = (r) =>
        r
          .trim()
          .replace(/^\||\|$/g, "")
          .split("|")
          .map((c) => c.trim());
      const body = rows.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      if (body.length)
        h += `<div class="tbl"><table><thead><tr>${cells(body[0])
          .map((c) => `<th>${inline(c)}</th>`)
          .join("")}</tr></thead><tbody>${body
          .slice(1)
          .map(
            (r) =>
              `<tr>${cells(r)
                .map((c) => `<td>${inline(c)}</td>`)
                .join("")}</tr>`,
          )
          .join("")}</tbody></table></div>`;
      continue;
    }
    if (/^>/.test(l)) {
      flush();
      const inner = [];
      while (i < lines.length && /^>/.test(lines[i])) inner.push(lines[i++].replace(/^>\s?/, ""));
      h += `<blockquote class="say">${blocks(inner)}</blockquote>`;
      continue;
    }
    if (/^\s*[-*] /.test(l)) {
      flush();
      let items = "";
      while (i < lines.length && /^\s*[-*] /.test(lines[i])) {
        let t = lines[i++].replace(/^\s*[-*] /, "");
        t = t.replace(/^\[ \] /, "☐ ").replace(/^\[x\] /i, "☑ ");
        items += `<li>${inline(t)}</li>`;
      }
      h += `<ul>${items}</ul>`;
      continue;
    }
    if (/^\s*\d+\. /.test(l)) {
      flush();
      let items = "";
      while (i < lines.length && /^\s*\d+\. /.test(lines[i]))
        items += `<li>${inline(lines[i++].replace(/^\s*\d+\. /, ""))}</li>`;
      h += `<ol>${items}</ol>`;
      continue;
    }
    if (/^#{1,6} /.test(l)) {
      flush();
      h += `<h5>${inline(l.replace(/^#+ /, ""))}</h5>`;
      i++;
      continue;
    }
    if (/^---+\s*$/.test(l)) {
      flush();
      i++;
      continue;
    }
    if (!l.trim()) {
      flush();
      i++;
      continue;
    }
    para.push(l);
    i++;
  }
  flush();
  return h;
}
const ASK_RE = /\{\.ask\}/;
/* split/join, not a regex with \s* on both sides: that one takes seconds on a heading with a long run of spaces */
const stripAsk = (t) => String(t).split("{.ask}").join(" ").replace(/\s+/g, " ").trim();
/* A doc = optional front matter, "# title", "## sections" (cards), "### questions" (blocks).
   With `split: bold` in the front matter, a whole-line **bold** also starts a question (for long answer docs). */
function parse(md, opts) {
  opts = opts || {};
  let lines = String(md || "")
    .replace(/\r/g, "")
    .split("\n");
  const fm = {};
  if (lines[0] === "---") {
    let j = 1;
    while (j < lines.length && lines[j] !== "---") {
      const m = lines[j].match(/^(\w+):\s*(.*)$/);
      if (m) fm[m[1]] = m[2];
      j++;
    }
    lines = lines.slice(j + 1);
  }
  let title = "";
  const intro = [];
  const secs = [];
  let cur = null,
    q = null;
  for (const l of lines) {
    if (/^# /.test(l) && !title) {
      title = l.slice(2).trim();
      continue;
    }
    if (/^## /.test(l)) {
      let t = stripAsk(l.slice(3).trim());
      const pay = /\{\.pay\}\s*$/.test(t);
      t = t.replace(/\s*\{\.pay\}\s*$/, "");
      cur = { title: t, pay, pre: [], qs: [] };
      q = null;
      secs.push(cur);
      continue;
    }
    if (/^### /.test(l) && cur) {
      let qt = l.slice(4).trim();
      const qask = ASK_RE.test(qt);
      qt = stripAsk(qt);
      const qpay = /\{\.pay\}\s*$/.test(qt);
      qt = qt.replace(/\s*\{\.pay\}\s*$/, "");
      q = { title: qt, lines: [], sub: !!opts.splitBold, pay: qpay, ask: qask };
      cur.qs.push(q);
      continue;
    }
    if (opts.splitBold && cur && /^\*\*[^*].*\*\*(\s*(✎.*|☐.*))?\s*$/.test(l)) {
      q = { title: l.replace(/^\*\*|\*\*(\s*(✎.*|☐.*))?\s*$/g, "") + (/(✎|☐)/.test(l) ? " ✎" : ""), lines: [] };
      cur.qs.push(q);
      continue;
    }
    if (q) q.lines.push(l);
    else if (cur) cur.pre.push(l);
    else intro.push(l);
  }
  return { fm, title, intro, secs };
}
const COPY =

function toText(node, skipExamples) {
  let out = "";

      out += n.textContent;
      return;
    }
    if (n.nodeType !== 1) return;
    const t = n.tagName;
    if (
      n.classList.contains("hcopy") ||
      n.classList.contains("paynote") ||
      n.classList.contains("mine") ||
      t === "H3" ||
      t === "H4"

      return;
    if (t === "BR") {
      out += "\n";
      return;
    }
    if (t === "LI") {
      if (skipExamples && n.querySelector("em.ex")) return;
      out += ctx.ol ? ++ctx.i + ". " : "- ";
      n.childNodes.forEach((c) => walk(c, ctx));

      return;

      n.childNodes.forEach((k) => walk(k, c));
      out += "\n";
      return;
    }
    if (t === "P") {
      n.childNodes.forEach((c) => walk(c, ctx));
      out += "\n\n";
      return;

    if (t === "TR") {
      [...n.children].forEach((c, i) => {
        out += (i ? " | " : "") + c.textContent.trim();

      out += "\n";
      return;

    n.childNodes.forEach((c) => walk(c, ctx));

}
function wireCopy(root) {
  for (const b of $qa("blockquote.say", root))
    if (!b.querySelector(":scope>.qcopy")) {
      const c = document.createElement("button");
      c.type = "button";
      c.className = "hcopy qcopy";
      c.textContent = "Copy answer";
      c.setAttribute("aria-label", "Copy this answer");
      b.prepend(c);
    }
  $qa(".hcopy:not(.qcopy)", root).forEach((b) => b.setAttribute("aria-label", "Copy this section"));
  if (root.__wired) return;
  root.__wired = true;
  root.addEventListener("click", (e) => {
    const b = e.target.closest(".hcopy");
    if (b && root.contains(b)) {
      e.stopPropagation();
      const isQuote = b.classList.contains("qcopy");
      const box = isQuote ? b.parentElement : b.closest(".hq,.hs");
      if (!box) return;
      if (box.closest(".pay") && payHidden()) {
        showPay(true);
        return;
      }
      const txt = toText(box, !isQuote);
      const lab = b.dataset.lab || b.textContent;
      b.dataset.lab = lab;
      const done = () => {
        b.textContent = "Copied";
        b.classList.add("ok");
        setTimeout(() => {
          b.textContent = lab;
          b.classList.remove("ok");
        }, 1100);
      };
      try {
        navigator.clipboard.writeText(txt).then(done, () => copyFallback(txt, done, b));
      } catch (_) {
        copyFallback(txt, done, b);

  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.append(ta);
  ta.select();
  let ok = false;
  try {
    ok = document.execCommand("copy");
  } catch (_) {}
  ta.remove();
  if (ok) done();
  else {
    const bb = btn || $q(".hcopy.ok,.hcopy:focus");
    if (bb) {
      const o = bb.textContent;
      bb.textContent = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || "")
        ? "Press ⌘C"
        : "Press Ctrl+C";
      setTimeout(() => (bb.textContent = o), 1800);
    }
  }
}

/* ---- 81-library-data.js ---- */
/* ================= guides and prep sheets: where they come from =================
   Library/**.md          guides (a subfolder is a group in the Library tab)
   Job notes/<id>/prep.md  a job's prep sheet (any Markdown with ## sections)
   Job notes/<id>/outreach.md, posting.md  shown folded at the end of the sheet
   With saving on, files are read live from your folder. Before that, Library/_bundle.js (made by `npm run bundle`)
   is the fallback, so the sample board works straight from a download. */
const FS = {
  ok() {
    try {
      return !!(dirHandle && canWrite);
    } catch (e) {
      return false;
    }
  },
  async dir(path, create) {
    let d = dirHandle;
    for (const seg of String(path).split("/").filter(Boolean))
      d = await d.getDirectoryHandle(seg, { create: !!create });
    return d;
  },
  /* {text,mtime} | null when the file does not exist | false when the folder can't be read right now */
  async read(path) {
    try {
      const parts = path.split("/");
      const name = parts.pop();
      const d = await this.dir(parts.join("/"));
      const f = await (await d.getFileHandle(name)).getFile();
      return { text: await f.text(), mtime: f.lastModified };
    } catch (e) {
      return e && e.name === "NotFoundError" ? null : false;
    }
  },
  async write(path, text) {
    const parts = path.split("/");
    const name = parts.pop();
    const d = await this.dir(parts.join("/"), true);
    const fh = await d.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(text);
    await w.close();
    const f = await fh.getFile();
    return f.lastModified;
  },
  async list(path) {
    const out = [];
    try {
      const d = await this.dir(path);
      for await (const [n, h] of d.entries()) out.push([n, h.kind]);
    } catch (e) {}
    return out;
  },
};
const MYPATH = "Library/My_answers.md";

const PREPTXT = {}; // job id -> prep.md text
const JOBDOCS = {}; // job id -> {outreach, posting}
/* "Library/Interviews/01_Call_scripts.md" -> "call-scripts" */

  slug(

    if (cur && cur.md === text && cur.path === path) return false;
    DOCS[id] = {
      title: p.fm.title || p.title || id,
      path,
      group: parts.length > 2 ? parts[1].replace(/^[\d\s._-]+/, "").replace(/_/g, " ") : "Guides",
      splitBold: p.fm.split === "bold",
      md: text,
    };
    return true;
  }
  const m = path.match(/^Job notes\/([^/]+)\/(prep|outreach|posting)\.md$/);
  if (m && m[1] !== "hunters") {

      if (PREPTXT[m[1]] === text) return false;
      PREPTXT[m[1]] = text;
      return true;
    }
    const jd = (JOBDOCS[m[1]] = JOBDOCS[m[1]] || {});

(function loadBundle() {
  const B = window.ORGANIZER_LIBRARY;

    for (const [p, t] of Object.entries(B.files)) if (typeof t === "string") ingest(p, t);
})();

function libGroups() {
  const ids = Object.keys(DOCS).sort((a, b) => DOCS[a].path.localeCompare(DOCS[b].path));
  const top = ids.filter((i) => DOCS[i].group === "Guides"),
    rest = ids.filter((i) => DOCS[i].group !== "Guides");
  const groups = new Map();
  if (top.length) groups.set("Guides", top);
  for (const i of rest) {
    if (!groups.has(DOCS[i].group)) groups.set(DOCS[i].group, []);
    groups.get(DOCS[i].group).push(i);
  }

let libReadAt = 0;
async function refreshDocs(force) {
  if (!FS.ok() || (!force && Date.now() - libReadAt < 3000)) return false;
  libReadAt = Date.now();
  let changed = false;
  const paths = [];
  for (const [n, k] of await FS.list("Library")) {
    if (k === "file" && /\.md$/i.test(n)) paths.push("Library/" + n);
    else if (k === "directory")
      for (const [n2, k2] of await FS.list("Library/" + n))
        if (k2 === "file" && /\.md$/i.test(n2)) paths.push(`Library/${n}/${n2}`);
  }
  for (const p of paths)
    if (isGuidePath(p)) {
      const r = await FS.read(p);
      if (r && ingest(p, r.text)) changed = true;
    }

let prepScanned = false;
const fileSeen = {};
async function scanPrep(opts) {
  opts = opts || {};
  if (!FS.ok()) return false;
  let changed = false;
  for (const [nm, kind] of await FS.list("Job notes")) {
    if (kind !== "directory" || nm === "hunters" || nm === opts.skip) continue;
    const r = await FS.read(`Job notes/${nm}/prep.md`);
    if (r && validPrep(r.text) && r.text !== PREPTXT[nm]) {

/* ---- 82-my-answers.js ---- */
/* ================= "My version" answers (Library/My_answers.md, written only by this page) =================
   Every ✎ question in a guide or prep sheet gets a box for your own wording, and every {.ask} question on a prep

   after you stop typing.
   The file is never written without reading it first: every write reads the file, merges it with this browser's
   answers and only then writes. Merge rule, per key:

   - an answer the file lost since this browser last read it (deleted by hand, by your assistant or from another tab)

     missing altogether deletes nothing);

   - any other key takes the file's value.

   this browser and are written once the file can be read. A file that reads as empty, lacks its "# My answers" title,
   or lost every answer at once (a sync client or an editor caught halfway) deletes nothing: the odd file is copied to
   backups/ and the file is written again from this browser's answers. Removing every answer on purpose is done with

/* The outreach guide: one "## Name, Firm" block per contact with **Connection request** and **Follow-up message** quotes.
   Keyed by the loosely compared name (normName), so "## jonah  whitfield, …" still finds Jonah Whitfield. */
function parseOutreach(md) {
  const out = {};

    const req = (blk.match(/\*\*Connection request\*\*[^\n]*\n\n((?:>.*\n?)+)/) || [])[1];
    const msg = (blk.match(/\*\*Follow-up message\*\*[^\n]*\n\n((?:>.*\n?)+)/) || [])[1];
    out[normName(name)] = {
      req: req ? req.replace(/^>\s?/gm, "").trim() : "",

    };
  }
  return out;
}
